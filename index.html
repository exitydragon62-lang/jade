<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versão Definitiva - Bracelete & Modo 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background-color: #0d0d11;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Painel HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            padding: 18px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 10;
            pointer-events: none;
            min-width: 280px;
        }

        #status-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        #status-mode {
            font-weight: 800;
            font-size: 1.1em;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .active-bg {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
        }

        .inactive-bg {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .instructions {
            font-size: 0.85em;
            color: #a0a0b0;
            line-height: 1.6;
        }

        .key {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>

    <!-- Libs do Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>

    <div id="hud">
        <div id="status-container">
            <span>MODO 3D:</span>
            <span id="status-mode" class="active-bg">ATIVO</span>
        </div>
        <div class="instructions">
            • Pressiona <span class="key">Y</span> para Ativar / Desativar<br>
            • Quando ativo, <b>qualquer coisa digitada</b> vira 3D<br>
            • <span class="key">Backspace</span> Apaga | <span class="key">Espaço</span> Limpa
        </div>
    </div>

    <script>
        // Variáveis do Estado do Sistema
        let is3DActive = true;
        let currentText = "BRACELETE 3D";
        let textMesh = null;
        let loadedFont = null;
        let braceletGroup = new THREE.Group();

        // 1. Configuração do Cenário
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Iluminação do Ambiente
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00ff88, 2, 80);
        pointLight1.position.set(15, 20, 15);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xffd700, 1.5, 80); // Luz dourada para destacar o metal
        pointLight2.position.set(-15, -10, 15);
        scene.add(pointLight2);

        camera.position.set(0, 0, 30);

        // 3. Criação do Bracelete (Fusão Geômétrica: Torus Hexagonal/Quadrado)
        function createBracelet() {
            // Material Dourado com Alto Brilho
            const goldMaterial = new THREE.MeshStandardMaterial({
                color: 0xd4af37,
                metalness: 0.9,
                roughness: 0.15
            });

            // Estrutura Base Rígida (Torus com perfis geométricos)
            const ringGeometry = new THREE.TorusGeometry(6, 0.6, 6, 32); 
            const mainRing = new THREE.Mesh(ringGeometry, goldMaterial);
            braceletGroup.add(mainRing);

            // Adicionar Elementos Cúbicos/Retangulares interligados (Fusão de Formas)
            const boxGeometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const box = new THREE.Mesh(boxGeometry, goldMaterial);
                box.position.x = Math.cos(angle) * 6;
                box.position.y = Math.sin(angle) * 6;
                box.rotation.z = angle;
                box.rotation.x = Math.PI / 4;
                braceletGroup.add(box);
            }

            scene.add(braceletGroup);
        }

        createBracelet();

        // 4. Carregamento de Fonte e Criação do Texto 3D
        const loader = new THREE.FontLoader();
        loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function (font) {
            loadedFont = font;
            update3DText();
        });

        function update3DText() {
            if (!loadedFont) return;

            if (textMesh) {
                scene.remove(textMesh);
                textMesh.geometry.dispose();
            }

            if (currentText.length === 0) return;

            const textGeometry = new THREE.TextGeometry(currentText, {
                font: loadedFont,
                size: 1.8,
                height: 0.5,
                curveSegments: 10,
                bevelEnabled: true,
                bevelThickness: 0.08,
                bevelSize: 0.04,
                bevelSegments: 4
            });

            textGeometry.center();

            const textMaterial = new THREE.MeshStandardMaterial({
                color: is3DActive ? 0x00ff88 : 0x555555,
                metalness: 0.5,
                roughness: 0.2
            });

            textMesh = new THREE.Mesh(textGeometry, textMaterial);
            textMesh.position.y = -9; // Posicionar o texto logo abaixo do bracelete
            scene.add(textMesh);
        }

        // 5. Escutador de Teclado (Controle do Modo e Entrada)
        window.addEventListener('keydown', (event) => {
            // Tecla Y: Alterna o Modo 3D
            if (event.key === 'y' || event.key === 'Y') {
                is3DActive = !is3DActive;
                const statusEl = document.getElementById('status-mode');
                
                if (is3DActive) {
                    statusEl.innerText = "ATIVO";
                    statusEl.className = "active-bg";
                } else {
                    statusEl.innerText = "DESATIVADO";
                    statusEl.className = "inactive-bg";
                }
                
                update3DText();
                return;
            }

            // Se o MODO 3D estiver DESATIVADO, não processa nenhuma tecla digitada
            if (!is3DActive) return;

            // Manipulação de texto se o MODO 3D estiver ATIVO
            if (event.key === 'Backspace') {
                currentText = currentText.slice(0, -1);
            } else if (event.key === ' ') {
                currentText = ""; 
            } else if (event.key.length === 1) {
                currentText += event.key.toUpperCase();
            }

            update3DText();
        });

        // 6. Loop de Animação
        function animate() {
            requestAnimationFrame(animate);

            // Rotação suave do Bracelete
            braceletGroup.rotation.y += 0.01;
            braceletGroup.rotation.x += 0.005;

            // Rotação sutil do Texto
            if (textMesh) {
                textMesh.rotation.y = Math.sin(Date.now() * 0.001) * 0.3;
            }

            renderer.render(scene, camera);
        }

        animate();

        // Redimensionamento Automático
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
