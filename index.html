<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jade IA 2.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
*{box-sizing:border-box}
body{background:#0d0814;font-family:'Segoe UI',Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px;color:#fff}
.app{width:100%;max-width:550px;background:#181124;padding:20px;border-radius:20px;border:1px solid #3b235d;box-shadow:0 10px 30px rgba(0,0,0,.8),0 0 15px rgba(138,43,226,.2);display:flex;flex-direction:column;gap:15px}
.header{text-align:center}
h1{color:#b366ff;margin:0;font-size:26px;text-shadow:0 0 8px rgba(179,102,255,.4)}
.subtitle{color:#a0a0b0;font-size:13px;margin-top:4px;font-weight:500}
#chat{background:#09050e;height:380px;overflow-y:auto;padding:15px;border-radius:14px;border:1px solid #2a1942;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.msg{max-width:90%;padding:10px 14px;border-radius:15px;font-size:14px;line-height:1.45;word-wrap:break-word}
.msg-jade{align-self:flex-start;background:#251638;color:#f0e6ff;border-bottom-left-radius:2px;border:1px solid #4c287a}
.msg-user{align-self:flex-end;background:#7928ca;color:#fff;border-bottom-right-radius:2px}
.digitando{opacity:.7;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#181124;border:1px solid #3b235d;color:#c9a8ff;padding:5px 10px;border-radius:14px;font-size:11px;cursor:pointer}
.chip:hover{background:#251638}
#container-3d{display:none;background:#05020a;border:1px solid #7928ca;border-radius:14px;padding:10px;flex-direction:column;gap:10px}
#canvas-3d{width:100%;height:250px;border-radius:10px;background:#000;touch-action:none}
.controles-3d{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.controles-3d select,.controles-3d input,.controles-3d button{background:#181124;border:1px solid #3b235d;color:#fff;padding:6px;border-radius:8px;font-size:12px}
.checkbox-container{grid-column:span 2;display:flex;align-items:center;gap:8px;font-size:12px;color:#0fc}
.input-box{display:flex;gap:8px}
input[type="text"]{flex:1;min-width:0;padding:12px 15px;background:#09050e;border:1px solid #3b235d;border-radius:12px;outline:none;font-size:14px;color:#fff}
input[type="text"]:focus{border-color:#9d4edf;box-shadow:0 0 8px rgba(157,78,223,.4)}
button{padding:12px 15px;border:0;border-radius:12px;background:#7928ca;color:#fff;font-weight:bold;cursor:pointer;transition:background .2s,transform .1s}
button:hover{background:#9d4edf}
button:active{transform:scale(.95)}
.btn-mic{background:#4c287a;user-select:none}
.btn-mic.recording{background:#ff2a6d;animation:pulse 1s infinite}
.footer-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.shortcut-hint{font-size:11px;color:#6e6e8d}
.btn-clear{background:transparent;color:#a0a0b0;font-size:11px;padding:0;text-decoration:underline}
.btn-clear:hover{color:#ff4d4d;background:transparent}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Jade IA</h1>
    <div class="subtitle">Criada por Luiz Benicio</div>
  </div>

  <div id="container-3d">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;font-weight:bold;color:#b366ff;">Modo 01110100 - Visualizador 3D</span>
      <button style="padding:2px 8px;font-size:10px;" onclick="fecharModo3D()">Fechar 3D</button>
    </div>
    <div id="canvas-3d"></div>
    <div class="controles-3d">
      <select id="selectForma">
        <option value="torus">Pulseira / Torus (Anel)</option>
        <option value="cube">Cubo / Bloco</option>
        <option value="sphere">Esfera / Bola</option>
        <option value="cylinder">Cilindro / Tubo</option>
        <option value="cone">Cone / Pirâmide</option>
        <option value="tetrahedron">Tetraedro (4 Faces)</option>
        <option value="octahedron">Octaedro (8 Faces)</option>
        <option value="dodecahedron">Dodecaedro (12 Faces)</option>
        <option value="icosahedron">Icosaedro (20 Faces)</option>
        <option value="plane">Plano / Superfície</option>
        <option value="ring">Anel / Disco Vazado</option>
      </select>
      <select id="selectMaterial">
        <option value="phong">Brilhante (Padrão)</option>
        <option value="standard">Metálico</option>
        <option value="glass">Vidro / Reflexivo</option>
      </select>
      <input type="color" id="corObjeto" value="#b366ff">
      <button onclick="adicionarForma3DManual()">Adicionar Forma</button>
      <div class="checkbox-container">
        <input type="checkbox" id="chkMesclar">
        <label for="chkMesclar">Mesclar com o projeto atual</label>
      </div>
      <button onclick="limparCena3D()" style="background:#4c287a;">Limpar Cenas</button>
      <button onclick="salvarProjeto3D()" style="background:#00b386;">Salvar Projeto</button>
    </div>
  </div>

  <div id="chat"></div>
  <div class="chips" id="chips"></div>

  <div class="input-box">
    <input id="mensagem" type="text" placeholder="Converse, peça um comando ou use atalhos..." autocomplete="off">
    <button onclick="enviar()">Enviar</button>
    <button id="btnOuvir" class="btn-mic" onmousedown="iniciarGravacao()" onmouseup="pararGravacao()" onmouseleave="pararGravacao()" ontouchstart="iniciarGravacao(event)" ontouchend="pararGravacao(event)">Falar</button>
  </div>

  <div class="footer-actions">
    <span class="shortcut-hint"><b>C</b> falar | <b>V</b> status | <b>M</b> site | <b>T</b> 3D | <b>N</b> voltar</span>
    <span>
      <button class="btn-clear" id="btnVoz" onclick="alternarVoz()">Voz: ligada</button> &nbsp;
      <button class="btn-clear" onclick="limparMemoria()">Resetar aprendizado</button>
    </span>
  </div>
</div>

<script>
/* ================= ESTADO ================= */
let memoria = { conhecimentos: [], tarefas: [], projetos3D: [], perfil: {} };
try { Object.assign(memoria, JSON.parse(localStorage.getItem("jade_memoria")) || {}); } catch (e) {}
memoria.perfil = memoria.perfil || {};
let modoAprendizado = false, etapaAprendizado = 0, perguntaTemp = "";
let gravacaoAtiva = false, rec = null, vozLigada = true;
let modo3DAtivo = false, scene3D, camera3D, renderer3D, grupoProjeto3D, controls3D, animId3D = null;
const ctx = { ultimoTema: null, historico: [], msgs: 0 };

const inputEl = document.getElementById("mensagem");
const chatEl = document.getElementById("chat");
const btnMic = document.getElementById("btnOuvir");

/* ================= UTILIDADES ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = arr => arr[Math.floor(Math.random() * arr.length)];
const salvarMemoria = () => { try { localStorage.setItem("jade_memoria", JSON.stringify(memoria)); } catch (e) {} };

function normalizar(txt) {
  return String(txt).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/(.)\1{2,}/g, "$1").replace(/[?!=.,;:]/g, " ").replace(/\s+/g, " ").trim();
}
const STOP = new Set("a o as os um uma de do da dos das em no na nos nas por para pra com que e eh me te se ao aos jade voce vc mestre porque pq favor pode poderia queria quero gostaria".split(" "));
const tokens = t => normalizar(t).split(" ").filter(w => w && !STOP.has(w));

function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m || !n) return Math.max(m, n);
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const similaridade = (a, b) => { a = normalizar(a); b = normalizar(b); const mx = Math.max(a.length, b.length); return mx ? 1 - lev(a, b) / mx : 1; };

function saudacaoHora() {
  const h = new Date().getHours();
  return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
}
const chamar = () => memoria.perfil.nome ? esc(memoria.perfil.nome) : "Mestre";

/* ================= VOZ / CHAT ================= */
function alternarVoz() {
  vozLigada = !vozLigada;
  if (!vozLigada && 'speechSynthesis' in window) speechSynthesis.cancel();
  document.getElementById("btnVoz").textContent = "Voz: " + (vozLigada ? "ligada" : "desligada");
}

function falar(texto) {
  if (!vozLigada || !('speechSynthesis' in window)) return;
  let t = texto.replace(/<small>.*?<\/small>/g, ' ').replace(/<[^>]*>?/gm, ' ').replace(/&\w+;/g, ' ').replace(/\s+/g, ' ').trim();
  if (t.length > 220) t = t.substring(0, 220).replace(/\s\S*$/, "") + "... o restante está no chat!";
  speechSynthesis.cancel();
  const v = new SpeechSynthesisUtterance(t);
  v.lang = "pt-BR"; v.pitch = 1.2; v.rate = 1.0;
  const fem = speechSynthesis.getVoices().find(x => x.lang.includes("pt") && /Luciana|Yelda|Google português|Maria|Helena|Francisca/.test(x.name));
  if (fem) v.voice = fem;
  speechSynthesis.speak(v);
}

function escrever(texto, remetente, cru) {
  const div = document.createElement("div");
  div.classList.add("msg");
  if (remetente === "user") {
    div.classList.add("msg-user");
    div.innerHTML = `<b>Mestre:</b> ${cru ? texto : esc(texto)}`;
  } else {
    div.classList.add("msg-jade");
    div.innerHTML = `<b>Jade:</b> ${texto}`;
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function jadeDiz(html, voz) { escrever(html, "jade"); falar(voz || html); }

function renderChips() {
  const sugestoes = ["Que horas são?", "Conte uma piada", "Minhas tarefas", "Modo 3D", "Ajuda"];
  const box = document.getElementById("chips");
  box.innerHTML = "";
  sugestoes.forEach(s => {
    const c = document.createElement("span");
    c.className = "chip"; c.textContent = s;
    c.onclick = () => { inputEl.value = s; enviar(); };
    box.appendChild(c);
  });
}

/* ================= ATALHOS ================= */
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") enviar(); });
window.addEventListener("keydown", e => {
  if (document.activeElement === inputEl) return;
  const k = e.key.toLowerCase();
  if (k === "c" && !gravacaoAtiva) iniciarGravacao();
  else if (k === "v") gerarRelatorioMestre();
  else if (k === "m") { e.preventDefault(); prepararAberturaSite(); }
  else if (k === "t") { e.preventDefault(); ativarModo3D(); }
  else if (k === "n") { e.preventDefault(); voltarParaJade(); }
});
window.addEventListener("keyup", e => { if (e.key.toLowerCase() === "c" && gravacaoAtiva) pararGravacao(); });

function limparMemoria() {
  if (confirm("Mestre, deseja apagar todo o aprendizado, tarefas, perfil e projetos 3D salvos?")) {
    memoria = { conhecimentos: [], tarefas: [], projetos3D: [], perfil: {} };
    salvarMemoria();
    jadeDiz("Toda a minha memória foi limpa, Mestre! Recomeçando do zero.");
  }
}

/* ================= MÓDULO 3D ================= */
function inicializarCena3D() {
  const c = document.getElementById("canvas-3d");
  c.innerHTML = "";
  if (animId3D) cancelAnimationFrame(animId3D);
  if (typeof THREE === "undefined") { c.innerHTML = "<p style='padding:10px;font-size:12px'>Three.js não carregou. Verifique a internet.</p>"; return; }
  scene3D = new THREE.Scene();
  camera3D = new THREE.PerspectiveCamera(60, c.clientWidth / c.clientHeight, 0.1, 1000);
  camera3D.position.set(0, 0, 5);
  renderer3D = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer3D.setSize(c.clientWidth, c.clientHeight);
  renderer3D.setPixelRatio(window.devicePixelRatio);
  c.appendChild(renderer3D.domElement);
  controls3D = new THREE.OrbitControls(camera3D, renderer3D.domElement);
  controls3D.enableDamping = true; controls3D.dampingFactor = 0.05;
  controls3D.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
  const luz = new THREE.DirectionalLight(0xffffff, 1); luz.position.set(5, 5, 5).normalize(); scene3D.add(luz);
  scene3D.add(new THREE.AmbientLight(0x404040, 1.5));
  grupoProjeto3D = new THREE.Group(); scene3D.add(grupoProjeto3D);
  (function loop() { animId3D = requestAnimationFrame(loop); controls3D.update(); renderer3D.render(scene3D, camera3D); })();
}

function ativarModo3D() {
  modo3DAtivo = true;
  document.getElementById("container-3d").style.display = "flex";
  inicializarCena3D();
  jadeDiz("[Modo 01110100] Estúdio 3D ativado, Mestre! Peça <b>qualquer coisa</b> (formas, casa, carro, robô, gato, foguete... ou até palavras que eu não conheço) por voz ou texto: <i>\"cria um cubo vermelho de vidro\"</i>. Use pinça para zoom e arraste para girar.", "Modo 3D de projetos ativado, Mestre!");
}
function fecharModo3D() {
  modo3DAtivo = false;
  document.getElementById("container-3d").style.display = "none";
  if (animId3D) cancelAnimationFrame(animId3D);
}

let corManual = false;
const P4 = (x, z, f) => [[x, z], [-x, z], [x, -z], [-x, -z]].map(f);

function criarGeometria(t) {
  switch (t) {
    case 'torus': return new THREE.TorusGeometry(1.2, 0.4, 16, 100);
    case 'cube': return new THREE.BoxGeometry(1.5, 1.5, 1.5);
    case 'sphere': return new THREE.SphereGeometry(1.2, 32, 32);
    case 'cylinder': return new THREE.CylinderGeometry(0.8, 0.8, 2, 32);
    case 'cone': return new THREE.ConeGeometry(1, 2, 32);
    case 'pyramid': { const g = new THREE.ConeGeometry(1.4, 2, 4); g.rotateY(Math.PI / 4); return g; }
    case 'tetrahedron': return new THREE.TetrahedronGeometry(1.5);
    case 'octahedron': return new THREE.OctahedronGeometry(1.5);
    case 'dodecahedron': return new THREE.DodecahedronGeometry(1.3);
    case 'icosahedron': return new THREE.IcosahedronGeometry(1.3);
    case 'plane': return new THREE.PlaneGeometry(2, 2);
    case 'ring': return new THREE.RingGeometry(0.5, 1.5, 32);
    case 'lozenge': { const g = new THREE.OctahedronGeometry(1.4); g.scale(.7, 1.3, .7); return g; }
    case 'egg': { const g = new THREE.SphereGeometry(1, 32, 32); g.scale(.85, 1.2, .85); return g; }
    case 'knot': return new THREE.TorusKnotGeometry(.9, .3, 100, 16);
    case 'prism3': case 'prism5': case 'prism6': case 'prism8': { const g = new THREE.CylinderGeometry(1.2, 1.2, 1, +t.slice(5)); g.rotateX(Math.PI / 2); return g; }
    case 'helix': {
      class Hel extends THREE.Curve { getPoint(u, o = new THREE.Vector3()) { const a = u * Math.PI * 8; return o.set(Math.cos(a) * .8, u * 3 - 1.5, Math.sin(a) * .8); } }
      return new THREE.TubeGeometry(new Hel(), 120, .12, 8, false);
    }
    case 'star': {
      const sh = new THREE.Shape();
      for (let i = 0; i < 10; i++) { const r = i % 2 ? .55 : 1.3, a = Math.PI / 5 * i + Math.PI / 2, x = Math.cos(a) * r, y = Math.sin(a) * r; i ? sh.lineTo(x, y) : sh.moveTo(x, y); }
      const g = new THREE.ExtrudeGeometry(sh, { depth: .4, bevelEnabled: false }); g.center(); return g;
    }
    case 'heart': {
      const sh = new THREE.Shape();
      sh.moveTo(0, -1); sh.bezierCurveTo(-.2, -.7, -1.2, -.2, -1.2, .4); sh.bezierCurveTo(-1.2, 1.1, -.3, 1.3, 0, .7);
      sh.bezierCurveTo(.3, 1.3, 1.2, 1.1, 1.2, .4); sh.bezierCurveTo(1.2, -.2, .2, -.7, 0, -1);
      const g = new THREE.ExtrudeGeometry(sh, { depth: .5, bevelEnabled: false }); g.center(); return g;
    }
    default: return new THREE.BoxGeometry(1, 1, 1);
  }
}

function criarMaterial3D(tipo, hex) {
  const color = new THREE.Color(hex), side = THREE.DoubleSide;
  if (tipo === 'standard') return new THREE.MeshStandardMaterial({ color, roughness: .2, metalness: .8, side });
  if (tipo === 'glass') return new THREE.MeshPhysicalMaterial({ color, roughness: .1, transmission: .9, opacity: 1, transparent: true, side });
  return new THREE.MeshPhongMaterial({ color, shininess: 100, side });
}
const mk = (geo, cor, mat, principal) => { const m = new THREE.Mesh(geo, criarMaterial3D(mat, cor)); m.userData.principal = !!principal; return m; };

/* Catálogo: g = geometria simples | p = receita de várias peças [tipo, dimensões, posição, cor(0=principal), rotação, escala] */
const R = {
  tetrahedron: { n: 'tetraedro', re: 'tetraedro|quatro lados', g: 1 },
  octahedron: { n: 'octaedro', re: 'octaedro|diamante', g: 1 },
  dodecahedron: { n: 'dodecaedro', re: 'dodecaedro', g: 1 },
  icosahedron: { n: 'icosaedro', re: 'icosaedro|bola de futebol', g: 1 },
  star: { n: 'estrela', re: 'estrela', g: 1 },
  heart: { n: 'coração', re: 'coracao', g: 1 },
  helix: { n: 'espiral', re: 'espiral|mola|helice', g: 1 },
  knot: { n: 'nó toroidal', re: 'no toroidal|torus knot|no celta', g: 1 },
  lozenge: { n: 'losango', re: 'losango', g: 1 },
  egg: { n: 'ovo', re: 'ovo|elipsoide|ovoide|oval', g: 1 },
  prism3: { n: 'triângulo', re: 'triangulo|prisma triangular', g: 1 },
  prism5: { n: 'pentágono', re: 'pentagono', g: 1 },
  prism6: { n: 'hexágono', re: 'hexagono|colmeia', g: 1 },
  prism8: { n: 'octógono', re: 'octogono', g: 1 },
  ring: { n: 'disco vazado', re: 'disco|anel vazado|arruela', g: 1 },
  torus: { n: 'pulseira / anel', re: 'pulseira|anel|rosca|torus|rosquinha|coroa|aro|donut|pneu', g: 1 },
  pyramid: { n: 'pirâmide', re: 'piramide', g: 1 },
  cube: { n: 'cubo', re: 'caixa|cubo|bloco|quadrado|dado', g: 1 },
  sphere: { n: 'esfera', re: 'bola|esfera|globo|orbe', g: 1 },
  cylinder: { n: 'cilindro', re: 'cilindro|tubo|lata|barril', g: 1 },
  cone: { n: 'cone', re: 'cone|chapeu', g: 1 },
  plane: { n: 'plano', re: 'plano|placa|chapa|superficie', g: 1 },
  bonecoNeve: { n: 'boneco de neve', re: 'boneco de neve|homem de neve', def: '#ffffff', p: [['s', [.9], [0, -.7, 0], 0], ['s', [.65], [0, .3, 0], 0], ['s', [.45], [0, 1.1, 0], 0], ['c', [.07, .4], [0, 1.1, .5], '#f57c00', [1.571, 0, 0]], ['s', [.05], [-.12, 1.2, .41], '#111'], ['s', [.05], [.12, 1.2, .41], '#111']] },
  casa: { n: 'casa', re: 'casa|chale|moradia|residencia', def: '#e8d5b0', p: [['b', [2, 1.4, 2], [0, 0, 0], 0], ['c', [1.7, 1.1, 4], [0, 1.25, 0], '#a0392b', [0, .785, 0]], ['b', [.5, .8, .06], [0, -.3, 1.02], '#5b3a1e'], ['b', [.4, .4, .06], [-.65, .15, 1.02], '#9fd3ff'], ['b', [.4, .4, .06], [.65, .15, 1.02], '#9fd3ff']] },
  castelo: { n: 'castelo', re: 'castelo|fortaleza', def: '#b0a99f', p: [['b', [2.4, 1.2, 1.2], [0, 0, 0], 0], ...P4(1.2, .6, ([x, z]) => ['y', [.32, .32, 1.8], [x, .3, z], 0]), ...P4(1.2, .6, ([x, z]) => ['c', [.4, .6, 16], [x, 1.5, z], '#8b2f2f']), ['b', [.6, .8, .06], [0, -.2, .62], '#3b2a1a']] },
  torre: { n: 'torre', re: 'torre|farol', def: '#b8b8b8', p: [['y', [.7, .9, 2.2], [0, 0, 0], 0], ['c', [.95, .9, 16], [0, 1.55, 0], '#8b2f2f'], ['b', [.25, .5, .06], [0, -.6, .88], '#3b2a1a']] },

function rotulo(txt) {

/* Qualquer palavra desconhecida vira uma "interpretação livre": forma procedural única e estável para aquele nome */
function objetoLivre(palavra, cor, mat) {
  let h = 7; for (const ch of palavra) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const rd = () => (h = (h * 1664525 + 1013904223) >>> 0) / 4294967296;
  const g = new THREE.Group(), n = 3 + Math.floor(rd() * 3);
  const base = cor || '#' + new THREE.Color().setHSL(rd(), .6, .55).getHexString();
  let y = 0;
  for (let i = 0; i < n; i++) {
    const sz = (1.3 - i * .2) * (.7 + rd() * .6), t = Math.floor(rd() * 4);
    const geo = t === 0 ? new THREE.BoxGeometry(sz * 1.4, sz, sz * 1.4) : t === 1 ? new THREE.SphereGeometry(sz * .7, 24, 16) : t === 2 ? new THREE.CylinderGeometry(sz * .5, sz * .7, sz, 20) : new THREE.ConeGeometry(sz * .7, sz, 20);
    const m = mk(geo, base, mat, true); m.position.y = y + sz / 2; y += sz * .85; g.add(m);
    if (rd() > .6) for (const sd of [-1, 1]) { const b = mk(new THREE.SphereGeometry(sz * .25, 12, 12), '#f5f5f5', 'phong', false); b.position.set(sd * sz * .8, m.position.y, 0); g.add(b); }
  }
  const lb = rotulo(palavra); lb.position.y = y + .5; g.add(lb);
  return g;
}

function construir(chave, cor, mat, palavra) {
  const e = R[chave]; let g;
  if (chave === 'livre') g = objetoLivre(palavra || 'coisa', cor, mat);
  else if (e && e.g) { g = new THREE.Group(); g.add(mk(criarGeometria(chave), cor || corObjeto.value, mat, true)); }
  else if (e && e.p) {
    g = new THREE.Group(); const main = cor || e.def;
    e.p.forEach(([t, d, pos, c, rot, sc]) => {
      const geo = t === 'b' ? new THREE.BoxGeometry(...d) : t === 's' ? new THREE.SphereGeometry(d[0], 24, 16) : t === 'y' ? new THREE.CylinderGeometry(d[0], d[1], d[2], 20) : t === 'c' ? new THREE.ConeGeometry(d[0], d[1], d[2] || 24) : new THREE.TorusGeometry(d[0], d[1], 12, 40);
      const m = mk(geo, c || main, c ? 'phong' : mat, !c);
      m.position.set(...pos); if (rot) m.rotation.set(...rot); if (sc) m.scale.set(...sc); g.add(m);
    });
  } else return null;
  g.userData = { chave, cor: cor || null, material: mat, palavra, escala: 1 };
  return g;
}

function descartar(o) {
  o.traverse(n => {
    if (n.geometry && !n.isSprite) n.geometry.dispose();
    if (n.material) { if (n.material.map) n.material.map.dispose(); n.material.dispose(); }
  });
  if (o.parent) o.parent.remove(o);
}
function limparCena3D() { if (grupoProjeto3D) while (grupoProjeto3D.children.length) descartar(grupoProjeto3D.children[0]); }

function enquadrar() {
  if (!controls3D || !grupoProjeto3D || !grupoProjeto3D.children.length) return;
  const b = new THREE.Box3().setFromObject(grupoProjeto3D), c = b.getCenter(new THREE.Vector3()), sz = b.getSize(new THREE.Vector3());
  const d = Math.max(sz.x, sz.y, sz.z) * 1.5 + 2.5;
  controls3D.target.copy(c); camera3D.position.set(c.x, c.y + sz.y * .25, c.z + d); controls3D.update();
}

function inserir(obj, k) {
  obj.scale.setScalar(k || 1); obj.userData.escala = k || 1; obj.position.set(0, 0, 0); obj.updateMatrixWorld(true);
  const ob = new THREE.Box3().setFromObject(obj), oc = ob.getCenter(new THREE.Vector3());
  let x = -oc.x;
  if (grupoProjeto3D.children.length) x = new THREE.Box3().setFromObject(grupoProjeto3D).max.x + .4 - ob.min.x;
  obj.position.set(x, -1 - ob.min.y, -oc.z);
  grupoProjeto3D.add(obj); enquadrar();
}

  });

}
function carregarProjeto3D(idx) {
  const p = memoria.projetos3D[idx]; if (!p) return false;
  if (!modo3DAtivo) ativarModo3D();

    g.scale.setScalar(o.escala || 1); g.userData.escala = o.escala || 1; g.position.set(o.posicao.x, o.posicao.y, o.posicao.z); grupoProjeto3D.add(g);
  });
  enquadrar(); return p;
}

/* ---------- Interpretação da fala/texto no Modo 3D ---------- */
const CORES = { vermelh: "#e02424", azul: "#2563eb", verde: "#16a34a", amarel: "#facc15", laranj: "#f97316", roxo: "#8b3dff", lilas: "#b39ddb", rosa: "#ec4899", branc: "#f5f5f5", pret: "#222222", dourad: "#d4af37", prat: "#c0c0c0", ciano: "#06b6d4", cinza: "#888888", marrom: "#8b5a2b", turquesa: "#1abc9c", bege: "#e8d5b0", vinho: "#7b1e3a" };
const QTDW = { um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, varios: 4, varias: 4, diversos: 4, alguns: 3, algumas: 3, duzia: 12 };

const MATS = [[/\b(metal\w*|aco|ferro|cromad\w*)\b/, 'standard'], [/\b(vidro|cristal|transparente|reflexiv\w*)\b/, 'glass'], [/\b(brilhante|plastico|fosco)\b/, 'phong']];
const FILL = new Set("objeto coisa forma modelo 3d tridimensional novo nova legal bonito bonita lindo linda simples estudio cena projeto tipo pouco ai aqui ali agora tambem ele ela isso isto esse essa dele dela cor material".split(" "));
const VERBO = /\b(cri\w+|ger\w+|mont\w+|constru\w+|desenh\w+|model\w+|adicion\w+|coloc\w+|faz\w*|faca\w*|fabriqu\w+|quero|preciso|me d\w+|mostr\w+|invent\w+|imagin\w+|projet\w+)\b/g;
const VERBO_T = new RegExp(VERBO.source);

const MOD_T = new RegExp(MOD.source);

function analisarTrecho(p) {
  const r = { qtd: 1, esc: 1, cor: null, mat: null, chave: null, palavra: null };
  const q = p.match(/\b(\d+|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|varios|varias|diversos|alguns|algumas|duzia)\b/);
  if (q) r.qtd = Math.max(1, Math.min(12, isNaN(q[1]) ? QTDW[q[1]] : parseInt(q[1])));
  for (const [rx, v] of TAM) if (rx.test(p)) { r.esc = v; break; }
  for (const k in CORES) if (new RegExp('\\b' + k).test(p)) { r.cor = CORES[k]; break; }
  const mt = MATS.find(([rx]) => rx.test(p)); if (mt) r.mat = mt[1];
  for (const k in R) if (R[k].rx.test(p)) { r.chave = k; break; }
  if (!r.chave) {
    const sobra = p.split(' ').filter(w => w && !STOP.has(w) && !FILL.has(w) && !/^\d+$/.test(w) && !(w in QTDW) && !isCor(w) && !TAM.some(([rx]) => rx.test(w)) && !MATS.some(([rx]) => rx.test(w)));
    if (sobra.length) { r.chave = 'livre'; r.palavra = sobra.slice(0, 2).join(' '); }
  }
  return r;
}

function aplicarEm(alvos, ref, fator) {
  alvos.forEach(o => {
    if (ref.cor || ref.mat) o.traverse(n => {
      if (n.isMesh && n.userData.principal) { const c = ref.cor || '#' + n.material.color.getHexString(); n.material.dispose(); n.material = criarMaterial3D(ref.mat || o.userData.material || 'phong', c); }
    });
    if (ref.cor) o.userData.cor = ref.cor; if (ref.mat) o.userData.material = ref.mat;
    if (fator !== 1) { o.scale.multiplyScalar(fator); o.userData.escala *= fator; }
  });
}

function interpretarVozPara3D(texto) {
  if (!grupoProjeto3D) return false;
  const t = normalizar(texto), filhos = grupoProjeto3D.children;
  if (/\b(tarefas?|nota|lembrete|timer|cronometro|alarme|google|site|youtube|clima|bateria)\b/.test(t)) return false;
  const criaExplicito = /\b(cri\w+|ger\w+|mont\w+|constru\w+|desenh\w+|model\w+)\b/.test(t);
  if (/^(o ?que|oque|quem|quando|por que|porque|qual|quais|quanto|onde|como|que)\b/.test(t) && !criaExplicito) return false;

  // Comandos de controle da cena
  if (/\b(limpar|apagar|zerar|deletar|remover)\b.*\b(cena|tudo|estudio|objetos)\b|\bcomecar de novo\b/.test(t)) { limparCena3D(); jadeDiz("Cena limpa, Mestre!"); return true; }
  const mp = t.match(/\b(?:abrir|carregar|abre|carrega)\b.*\bprojeto\b\s*(\d+)/);
  if (mp) { const p = carregarProjeto3D(parseInt(mp[1]) - 1); jadeDiz(p ? `Projeto <b>${esc(p.nome)}</b> carregado, Mestre!` : "Não achei esse projeto, Mestre.", p ? "Projeto carregado!" : "Não achei esse projeto."); return true; }
  if (/\bsalvar\b.*\bprojeto\b/.test(t)) { salvarProjeto3D(); return true; }
  if (/\b(mesclar|juntar|misturar)\b/.test(t)) { const on = !/\b(nao|desativar|parar)\b/.test(t); document.getElementById("chkMesclar").checked = on; jadeDiz(on ? "Modo mesclar ligado: vou somar objetos à cena." : "Modo mesclar desligado."); return true; }
  if (/\b(desfaz\w*|(remov\w+|apag\w+|tir\w+|delet\w+)\s+(o\s+)?ultim\w+)\b/.test(t)) { const u = filhos[filhos.length - 1]; if (u) descartar(u); enquadrar(); jadeDiz(u ? "Desfeito, Mestre! Removi o último objeto." : "A cena já está vazia."); return true; }
  if (/\b(gir\w+|rotacion\w+|roda\w*)\b/.test(t) && controls3D) { controls3D.autoRotate = !/\b(par\w+|desliga\w*|chega)\b/.test(t); controls3D.autoRotateSpeed = 3; jadeDiz(controls3D.autoRotate ? "Girando a cena, Mestre!" : "Parei de girar."); return true; }
  if (/\b(aramado|wireframe|malha|contorno)\b/.test(t)) { grupoProjeto3D.traverse(n => { if (n.isMesh) n.material.wireframe = !n.material.wireframe; }); jadeDiz("Alternei a visão aramada, Mestre!"); return true; }

  // Interpretação livre: verbos e enfeites saem, sobram objetos + modificadores
  const limpo = t.replace(VERBO, ' ').replace(MOD, ' ').replace(/\b(por favor|jade|mestre|um pouco|no estudio|na cena)\b/g, ' ').replace(/\s+/g, ' ').trim();
  const partes = limpo.split(/\s+(?:e|com|mais|ao lado de|junto)\s+|\s*,\s*/).map(x => x.trim()).filter(Boolean);
  const itens = [];
  for (const p of partes) {
    const r = analisarTrecho(p);
    if (r.chave) itens.push(r);
    else if (itens.length && (r.cor || r.mat || r.esc !== 1)) { const u = itens[itens.length - 1]; u.cor = u.cor || r.cor; u.mat = u.mat || r.mat; if (u.esc === 1) u.esc = r.esc; }
  }

  // Modificar o que já existe: "muda para vermelho", "deixa o carro maior", "aumenta"
  if (MOD_T.test(t) && !VERBO_T.test(t) && filhos.length) {
    const ref = itens[0] || analisarTrecho(limpo);
    const fator = /\b(aument\w+|ampli\w+|cresc\w+)\b/.test(t) ? 1.3 : /\b(diminu\w+|reduz\w+|encolh\w+)\b/.test(t) ? .75 : ref.esc;
    const alvos = itens.length ? filhos.filter(o => itens.some(i => i.chave === o.userData.chave)) : (fator !== 1 && !/\b(tudo|todos)\b/.test(t) ? [filhos[filhos.length - 1]] : filhos.slice());
    if (alvos.length && (ref.cor || ref.mat || fator !== 1)) { aplicarEm(alvos, ref, fator); jadeDiz("Feito, Mestre! Ajustei o que estava no estúdio."); return true; }
  }

  if (!itens.length) {
    const g = analisarTrecho(limpo);
    if (g.cor || g.mat) { if (g.cor) { corObjeto.value = g.cor; corManual = true; } if (g.mat) selectMaterial.value = g.mat; jadeDiz("Ajustei cor/material para os próximos objetos. Agora diga o que quer criar!"); return true; }
    return false;
  }
  const livres = itens.filter(i => i.chave === 'livre');
  if (!criaExplicito && !VERBO_T.test(t)) {
    if (livres.length && (t.split(' ').length > 2 || classificar(texto) || buscarConhecimento(texto))) return false;
    if (t.split(' ').length > 6) return false;
  }

  const mesclar = document.getElementById("chkMesclar").checked; let limpou = false;
  for (const it of itens) {
    const cor = it.cor || (corManual ? corObjeto.value : null), mat = it.mat || selectMaterial.value;
    if (!mesclar && !limpou) { limparCena3D(); limpou = true; }
    for (let i = 0; i < it.qtd; i++) { const o = construir(it.chave, cor, mat, it.palavra); if (o) inserir(o, it.esc); }
  }
  const nomes = itens.map(i => `${i.qtd > 1 ? i.qtd + ' × ' : ''}<b>${i.chave === 'livre' ? esc(i.palavra) : R[i.chave].n}</b>`).join(', ');
  jadeDiz(livres.length
    ? `Não conheço a forma exata de ${livres.map(l => '<b>' + esc(l.palavra) + '</b>').join(', ')}, Mestre, então criei uma <b>interpretação livre</b>! Cena: ${nomes}. Diga <i>"muda para azul"</i> ou <i>"aumenta"</i> para ajustar.`
    : `Pronto, Mestre! Criei: ${nomes}.`, "Pronto, Mestre! Modelo 3D criado.");
  return true;
}

/* ================= CÁLCULO SEGURO ================= */
function calcular(orig) {
  let t = normalizar(orig).replace(/\bquanto\b|\bcalcul\w*|\bresultado\b|\bconta\b|\bde\b(?=\s*\d.*\d)/g, " ");
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*(?:%|por cento)\s*de\s*(\d+(?:[.,]\d+)?)/g, (_, a, b) => `(${a.replace(",", ".")}/100*${b.replace(",", ".")})`);
  t = t.replace(/raiz\s*(?:quadrada\s*)?(?:de\s*)?(\d+(?:[.,]\d+)?)/g, (_, a) => `(${Math.sqrt(parseFloat(a.replace(",", ".")))})`);
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*ao\s*quadrado/g, "($1**2)").replace(/(\d+(?:[.,]\d+)?)\s*ao\s*cubo/g, "($1**3)")
    .replace(/elevado\s*a\s*/g, "**").replace(/\^/g, "**")
    .replace(/\bmais\b/g, "+").replace(/\bmenos\b/g, "-").replace(/\bvezes\b|\bmultiplicado por\b/g, "*")
    .replace(/(\d)\s*x\s*(\d)/g, "$1*$2").replace(/\bdividido por\b|\bdividido\b|\bpor\b/g, "/")
    .replace(/(\d),(\d)/g, "$1.$2");
  if (!/\d/.test(t) || !/[+\-*/%]/.test(t.replace(/^\s*-/, ""))) return null;
  if (!/^[\d+\-*/().%\s]+$/.test(t)) return null;
  try {
    const r = Function(`"use strict";return (${t})`)();
    if (typeof r !== "number" || !isFinite(r)) return "Não dá para calcular isso, Mestre (divisão por zero ou resultado inválido).";
    return `O resultado é: <b>${Number.isInteger(r) ? r : +r.toFixed(6)}</b>`;
  } catch (e) { return null; }
}

const WIKI = 'https://pt.wikipedia.org';
async function jget(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); }

function extrairDefinicao(t) {
  const P = [
    [/^(?:o ?que|oque|que)\s+(?:e|eh|sao|significa|quer dizer|seria|eram|era)\s+(.+)$/, 'def'],
    [/^quem\s+(?:e|eh|foi|era|sao|eram|seria)\s+(.+)$/, 'quem'],
    [/^qual\s+(?:e|era|seria)\s+(?:o|a)\s+(?:significado|definicao|conceito|origem|historia)\s+(?:de|do|da|dos|das)\s+(.+)$/, 'def'],
    [/^(?:significado|definicao|conceito|origem|historia)\s+(?:de|do|da|dos|das)\s+(.+)$/, 'def'],
    [/^(?:me\s+)?explic\w+\s+como\s+(?:funciona|funcionam)\s+(.+)$/, 'como'],
    [/^como\s+(?:funciona|funcionam|surgiu|nasceu|foi criado|foi criada)\s+(.+)$/, 'como'],
    [/^onde\s+(?:fica|ficam|esta|estao|nasceu)\s+(.+)$/, 'onde'],
    [/^quando\s+(?:foi|nasceu|morreu|aconteceu|surgiu|comecou)\s+(.+)$/, 'quando'],
    [/^(?:o ?que\s+)?(?:voce\s+)?sabe\s+sobre\s+(.+)$/, 'def'],
    [/^(?:me\s+)?(?:fal\w+|cont\w+|diga|ensin\w+|mostr\w+)\s+(?:mais\s+)?(?:sobre|a respeito de)\s+(.+)$/, 'def'],
    [/^(?:me\s+)?(?:explic\w+|defin\w+)\s+(?:o que e\s+|sobre\s+|de\s+|do\s+|da\s+)?(.+)$/, 'def'],
    [/^(?:pesquis\w+|busc\w+|procur\w+)\s+(?:sobre|por)?\s*(.+)$/, 'def'],
    [/^(.+?)\s+(?:e|eh)\s+(?:o ?que|que)$/, 'def']
  ];
  for (const [rx, tipo] of P) {
    const m = t.match(rx); if (!m) continue;
    const termo = m[1].replace(/\b(por favor|pra mim|para mim|jade|mestre)\b/g, ' ').replace(/^(?:(?:a|o|as|os|um|uma|uns|umas|de|do|da)\s+)+/, '').replace(/\s+/g, ' ').trim();
    if (!termo || termo.split(' ').length > 7) continue;
    if (/^(voce|vc|tu)$/.test(termo)) return null;
    return { termo, tipo, palavra: /\b(significa|significado|quer dizer)\b/.test(t) && termo.split(' ').length === 1 };
  }
  return null;
}

function formatarResumo(s) {
  ctx.ultimoTitulo = s.title; ctx.ultimoTema = s.title; ctx.texto = null;
  const frases = s.extract.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]+(\s|$)/g) || [s.extract];
  let out = ''; for (const f of frases) { if (out && (out + f).length > 420) break; out += f; }
  out = out.trim(); ctx.introFim = out.slice(-30);
  const link = s.content_urls && s.content_urls.desktop && s.content_urls.desktop.page;
  return `<b>${esc(s.title)}</b>${s.description ? ` <i>— ${esc(s.description)}</i>` : ''}<br>${esc(out)}<br><br><small>${link ? `<a href="${esc(link)}" target="_blank" rel="noopener" style="color:#c9a8ff">Fonte: Wikipédia</a> · ` : ''}diga <i>"fale mais"</i> para aprofundar</small>`;
}

async function definirTitulo(titulo) {
  try { const s = await jget(`${WIKI}/api/rest_v1/page/summary/${encodeURIComponent(titulo.replace(/ /g, '_'))}`); return s.extract ? formatarResumo(s) : null; } catch (e) { return null; }
}

async function wikt(p) {
  try {
    const d = await jget(`https://pt.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(p)}`);
    const arr = d.pt || d[Object.keys(d)[0]]; if (!arr || !arr.length) return null;
    const linhas = [];
    for (const b of arr.slice(0, 3)) {
      const defs = (b.definitions || []).slice(0, 2).map(x => x.definition.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()).filter(x => x.length > 3);
      if (defs.length) linhas.push(`<i>${esc(b.partOfSpeech || '')}</i>: ${defs.map(esc).join('; ')}`);
    }
    if (!linhas.length) return null;
    ctx.ultimoTitulo = p; ctx.ultimoTema = p;
    return `<b>${esc(p)}</b> <small>(Wikcionário)</small><br>${linhas.join('<br>')}`;
  } catch (e) { return null; }
}

async function definir(termo, tipo, palavra) {
  if (/^(isso|isto|aquilo|ele|ela|esse|essa)$/.test(termo)) { if (!ctx.ultimoTitulo) return "Sobre o que você quer saber, Mestre?"; termo = ctx.ultimoTitulo; }
  const uni = termo.split(' ').length === 1, nt = normalizar(termo);
  if (palavra) { const d = await wikt(nt); if (d) return d; }
  const busca = q => jget(`${WIKI}/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=5&srinfo=suggestion&format=json&origin=*`);
  let lista = [], aviso = '';
  try {
    let b = await busca(termo); lista = b.query.search || [];
    const sug = b.query.searchinfo && b.query.searchinfo.suggestion;
    if (!lista.length && sug) { b = await busca(sug); lista = b.query.search || []; aviso = `<small>(Entendi <b>${esc(sug)}</b>)</small><br>`; }
  } catch (e) { return null; }
  if (!lista.length) return uni ? await wikt(nt) : null;
  const pts = c => { const ct = normalizar(c.title.replace(/\(.*\)/, '')); return similaridade(ct, nt) + (ct === nt ? .5 : 0) + (ct.startsWith(nt) ? .2 : 0); };
  lista.sort((a, b) => pts(b) - pts(a));
  let desamb = false;
  for (const c of lista.slice(0, 3)) {
    try {
      const s = await jget(`${WIKI}/api/rest_v1/page/summary/${encodeURIComponent(c.title.replace(/ /g, '_'))}`);
      if (s.type === 'disambiguation') { if (c === lista[0]) desamb = true; continue; }
      if (!s.extract) continue;
      const rel = tokens(termo).some(w => normalizar(s.title + ' ' + c.snippet).includes(w.slice(0, 5)));
      if (pts(c) < .4 && !rel) continue;
      return aviso + formatarResumo(s);
    } catch (e) {}
  }
  if (desamb) {
    const ops = lista.filter(c => !/desambigua/i.test(c.title)).slice(0, 4).map(c => c.title);
    if (ops.length > 1) { ctx.opcoes = ops; return `<b>${esc(termo)}</b> pode ter vários significados, Mestre:<br>` + ops.map((o, i) => `<br>${i + 1}. ${esc(o)}`).join('') + `<br><br>Diga o número ou o nome do que você quer.`; }
  }
  return uni ? await wikt(nt) : null;
}

async function maisSobre() {
  if (!ctx.ultimoTitulo) return null;
  try {
    if (!ctx.texto) {
      const r = await jget(`${WIKI}/w/api.php?action=query&prop=extracts&explaintext&exchars=5000&titles=${encodeURIComponent(ctx.ultimoTitulo)}&format=json&origin=*`);
      const pg = Object.values(r.query.pages)[0];
      ctx.texto = (pg.extract || '').replace(/==+[^=]+==+/g, ' ').replace(/\s+/g, ' ').trim();
      const i = ctx.introFim ? ctx.texto.indexOf(ctx.introFim) : -1; ctx.pos = i >= 0 ? i + ctx.introFim.length : 0;
    }
    let ch = ctx.texto.substr(ctx.pos, 650); const c = ch.lastIndexOf('. '); if (c > 200) ch = ch.slice(0, c + 1);
    ctx.pos += ch.length;
    if (!ch.trim()) return "Isso é tudo que consegui encontrar sobre esse assunto, Mestre.";
    return esc(ch.trim()) + `<br><br><small>diga <i>"fale mais"</i> para continuar</small>`;
  } catch (e) { return null; }
}

async function pesquisarNaWeb(orig) {
  const termo = tokens(orig).slice(0, 5).join(' ');
  if (termo.length < 2) return null;
  return await definir(termo, 'def', false);
}

    r: () => rnd([`Até logo, ${chamar()}! Estarei aqui quando precisar.`, "Tchau! Bons momentos até nos falarmos de novo.", "Até mais! Descanse bem."]) },
  { id: "sim", k: ["sim", "claro", "com certeza", "pode ser", "ok", "beleza entao", "aham", "isso"], r: () => ctx.ultimoTema === "estado" ? "Que bom! Então me diga: no que posso ajudar?" : "Certo, Mestre! Pode continuar." },
  { id: "nao", k: ["nao", "nao obrigado", "nada", "deixa quieto", "esquece"], r: () => "Tudo bem, Mestre! Se mudar de ideia, é só chamar." },
  { id: "status", k: ["status", "relatorio", "informacoes do ambiente", "dados do ambiente", "clima", "temperatura", "bateria", "tempo hoje"], r: () => { gerarRelatorioMestre(); return null; } },
  { id: "modo3d", k: ["modo 3d", "estudio 3d", "abrir 3d", "ativar 3d", "projetos 3d", "01110100"], r: () => { ativarModo3D(); return null; } }
];

function classificar(txt) {
  const tks = normalizar(txt).split(" ").filter(Boolean);
  const norm = " " + tks.join(" ") + " ";
  let melhor = null, pontos = 0;
  for (const it of INTENCOES) {
    let s = 0;
    for (const k of it.k) {
      const palavras = k.split(" ");
      if (palavras.length > 1) { if (norm.includes(" " + k + " ")) s = Math.max(s, palavras.length * 2.2); }
      else for (const t of tks) {
        if (t === k) s = Math.max(s, 2);
        else if (k.length > 4 && lev(t, k) <= (k.length > 7 ? 2 : 1)) s = Math.max(s, 1.6);
      }
    }
    // Frases curtas favorecem intenção direta; textos longos exigem evidência maior
    if (s > 0 && tks.length > 8) s *= 0.75;
    if (s > pontos) { pontos = s; melhor = it; }
  }
  return pontos >= 1.6 ? melhor : null;
}

/* ================= COMANDOS ESTRUTURADOS ================= */
function listarTarefas() {
  if (!memoria.tarefas.length) return `Sua lista está vazia, ${chamar()}! Diga <i>"adicionar tarefa ..."</i> para começar.`;
  return "Suas tarefas:<br>" + memoria.tarefas.map((t, i) => `<br>${i + 1}. ${t.ok ? "✅ <s>" + esc(t.t) + "</s>" : "⬜ " + esc(t.t)}`).join("");
}

function comandos(orig, t) {
  // Perfil
  let m = orig.match(/\b(?:meu nome (?:é|e)|me chamo|pode me chamar de|eu sou (?:o|a)?)\s+([A-Za-zÀ-ú]{2,20})/i);
  if (m && !/^(muito|so|um|uma|bem)$/i.test(m[1])) {
    memoria.perfil.nome = m[1].charAt(0).toUpperCase() + m[1].slice(1); salvarMemoria();
    return `Prazer, <b>${esc(memoria.perfil.nome)}</b>! Vou te chamar assim daqui para frente (mas você sempre será meu Mestre 😉).`;
  }
  if (/\b(qual (e )?meu nome|sabe meu nome|como me chamo)\b/.test(t))
    return memoria.perfil.nome ? `Seu nome é <b>${esc(memoria.perfil.nome)}</b>, Mestre!` : "Ainda não sei o seu nome. Diga <i>'meu nome é ...'</i>!";

  // Tarefas
  m = orig.match(/\b(?:adicionar|adiciona|nova|criar|anotar|anota|lembrar de|colocar)\s+(?:uma\s+)?(?:tarefa|nota|lembrete)?\s*(?:de|para|:)?\s*(.+)/i);
  if (m && /\b(tarefa|nota|lembrete|anot\w*)\b/.test(t) && m[1].trim().length > 1) {
    memoria.tarefas.push({ t: m[1].trim(), ok: false }); salvarMemoria();
    return `Anotado, Mestre! Tarefa <b>${memoria.tarefas.length}</b>: ${esc(m[1].trim())}`;
  }
  if (/\b(minhas tarefas|listar tarefas|ver tarefas|lista de tarefas|o que tenho pra fazer|tarefas pendentes|mostrar tarefas)\b/.test(t)) return listarTarefas();
  m = t.match(/\b(concluir|concluida|feito|finalizar|terminei|completar)\b.*?(\d+)/);
  if (m) {
    const i = parseInt(m[2]) - 1;
    if (!memoria.tarefas[i]) return "Não achei essa tarefa, Mestre. Diga <i>'minhas tarefas'</i>.";
    memoria.tarefas[i].ok = true; salvarMemoria();
    return `Parabéns, Mestre! ✅ Concluí: <b>${esc(memoria.tarefas[i].t)}</b>`;
  }
  m = t.match(/\b(apagar|remover|excluir|deletar)\b.*?tarefa\b.*?(\d+)/);
  if (m) {
    const i = parseInt(m[2]) - 1;
    if (!memoria.tarefas[i]) return "Não achei essa tarefa, Mestre.";
    const r = memoria.tarefas.splice(i, 1)[0]; salvarMemoria();
    return `Removi a tarefa: <b>${esc(r.t)}</b>`;
  }
  if (/\b(limpar|apagar) (todas as )?tarefas\b/.test(t)) { memoria.tarefas = []; salvarMemoria(); return "Lista de tarefas limpa, Mestre!"; }

  // Timer
  m = t.match(/\b(timer|cronometro|alarme|lembrar|avisa\w*|me lembra)\b.*?(\d+)\s*(segundos?|seg|s|minutos?|min|horas?|h)\b/);
  if (m) {
    const n = parseInt(m[2]), u = m[3][0];
    const ms = n * (u === "h" ? 3600000 : u === "m" ? 60000 : 1000);
    const rotulo = `${n} ${u === "h" ? "hora(s)" : u === "m" ? "minuto(s)" : "segundo(s)"}`;
    setTimeout(() => jadeDiz(`⏰ Mestre, seu lembrete de <b>${rotulo}</b> terminou!`, "Mestre, seu tempo acabou!"), ms);
    return `Combinado! Aviso você em <b>${rotulo}</b>. (Mantenha esta aba aberta.)`;
  }

  // Projetos 3D salvos
  if (/\b(listar projetos|ver projetos|meus projetos)\b/.test(t)) {
    if (!memoria.projetos3D.length) return "Você não tem nenhum projeto 3D salvo, Mestre!";
    return "Seus projetos 3D:<br>" + memoria.projetos3D.map((p, i) => `<br>${i + 1}. <b>${esc(p.nome)}</b> (${p.data}) - ${p.objetos.length} objeto(s)`).join("") + "<br><br><i>Diga 'abrir projeto 1' para carregar.</i>";
  }
  m = t.match(/\b(?:abrir|carregar) projeto (\d+)/);
  if (m) { const p = carregarProjeto3D(parseInt(m[1]) - 1); return p ? `Projeto <b>${esc(p.nome)}</b> carregado!` : "Não achei esse projeto, Mestre."; }

  // Google
  m = orig.match(/\b(?:pesquis\w+|busc\w+|procur\w+)\s+(.+?)\s+(?:no|na)\s+(?:google|internet|web)\b/i) || orig.match(/\bgoogle(?:ar)?\s+(.+)/i);
  if (m) { window.open("https://www.google.com/search?q=" + encodeURIComponent(m[1]), "_blank"); return `Pesquisando <b>${esc(m[1])}</b> no Google para você, Mestre!`; }

  // Abrir site
  m = orig.match(/\b(?:abrir?|abre|acessar?|acessa|ir para|va para|vai para|entrar (?:no|na))\s+(?:o |a |no |na )?(?:site |pagina )?([\w.\-\/:]+)/i);
  if (m && !/^(projeto|tarefa|3d)/i.test(m[1])) { executarAberturaSite(m[1]); return null; }

  // Aprendizado gerenciado
  if (/\b(o que voce sabe|o que aprendeu|o que eu te ensinei|listar conhecimentos)\b/.test(t)) {
    if (!memoria.conhecimentos.length) return "Ainda não aprendi nada com você, Mestre. Diga <i>'quero te ensinar'</i>!";
    return "Aprendi com você:<br>" + memoria.conhecimentos.map(c => `<br>• <b>${esc(c.pergunta)}</b> → ${esc(c.resposta)}`).join("");
  }
  m = t.match(/\b(?:esquecer|esquece|apagar conhecimento)\s+(.+)/);
  if (m) {
    const antes = memoria.conhecimentos.length;
    memoria.conhecimentos = memoria.conhecimentos.filter(c => similaridade(c.pergunta, m[1]) < 0.75);
    salvarMemoria();
    return antes !== memoria.conhecimentos.length ? "Pronto, esqueci isso, Mestre!" : "Não encontrei esse conhecimento na memória.";
  }
  return undefined;
}

function buscarConhecimento(txt) {
  let melhor = null, s = 0;
  const alvo = normalizar(txt);
  for (const it of memoria.conhecimentos) {
    const sim = similaridade(it.pergunta, alvo);
    if (sim > s) { s = sim; melhor = it; }
  }
  return s >= 0.82 ? melhor : null;
}

/* ================= CÉREBRO ================= */
async function pensar(msg) {
  const orig = msg.trim();
  const t = normalizar(orig);

  if (orig.startsWith("/abrir ")) { const u = orig.slice(7).trim(); if (u) { executarAberturaSite(u); return null; } }

  if (ctx.opcoes) {
    let escolha = null; const n = t.match(/^(?:o |a |numero |opcao )?(\d)$/);
    if (n && ctx.opcoes[n[1] - 1]) escolha = ctx.opcoes[n[1] - 1];
    else { const c = ctx.opcoes.map(o => [o, similaridade(o, t)]).sort((a, b) => b[1] - a[1])[0]; if (c && (c[1] > .6 || (t.length > 3 && normalizar(c[0]).includes(t)))) escolha = c[0]; }
    ctx.opcoes = null;
    if (escolha) { const r = await definirTitulo(escolha); if (r) return r; }
  }

  if (/\b01110100\b/.test(t) || /\b(ativar|abrir|ligar|entrar no)?\s*modo 3d\b/.test(t)) { ativarModo3D(); return null; }

  if (modo3DAtivo && interpretarVozPara3D(orig)) return null;

  const conhecido = buscarConhecimento(orig);
  if (conhecido) return esc(conhecido.resposta);

  const cmd = comandos(orig, t);
  if (cmd !== undefined) return cmd;

  const conta = calcular(orig);
  if (conta) return conta;

  const it = classificar(orig);
  const NAO_DEF = ['identidade', 'criador', 'estado', 'piada', 'curiosidade', 'hora', 'data', 'status', 'modo3d', 'capacidades', 'elogio', 'critica'];

  if (/\b(fale mais|conte mais|mais detalhes|aprofund\w+|prossiga|continue)\b/.test(t) && ctx.ultimoTitulo) {
    const mais = await maisSobre(); if (mais) return mais;
  }

  const d = extrairDefinicao(t);
  if (d && !(it && NAO_DEF.includes(it.id))) {
    const r = await definir(d.termo, d.tipo, d.palavra);
    return r || `Procurei por <b>${esc(d.termo)}</b>, mas não achei nada confiável, Mestre. Pode escrever de outro jeito? Ou me ensine com <i>'quero te ensinar'</i>.`;
  }

  if (it) { ctx.ultimoTema = it.tema || it.id; return it.r(); }

  const web = await pesquisarNaWeb(orig);
  if (web) return web;

  return rnd([
    "Hmm, não encontrei isso na web nem na minha memória, Mestre. Pode reformular? Ou diga <i>'quero te ensinar'</i> e eu aprendo!",
    "Não entendi muito bem, Mestre. Tente outras palavras ou digite <i>'ajuda'</i> para ver o que sei fazer.",
    "Essa eu ainda não sei! Me ensine com <i>'quero te ensinar'</i> e da próxima vez eu respondo."
  ]);
}

async function enviar() {
  const msg = inputEl.value.trim();
  if (!msg) return;
  escrever(msg, "user");
  inputEl.value = "";
  const t = normalizar(msg);

  if (modoAprendizado) {
    if (/^(cancelar|cancela|deixa|esquece)$/.test(t)) { modoAprendizado = false; etapaAprendizado = 0; jadeDiz("Cancelei o aprendizado, Mestre."); return; }
    if (etapaAprendizado === 1) {
      perguntaTemp = msg; etapaAprendizado = 2;
      jadeDiz(`Entendido! E o que devo responder quando me disserem "${esc(perguntaTemp)}"?`, `Entendido! E o que devo responder quando me disserem ${perguntaTemp}?`);
      return;
    }
    if (etapaAprendizado === 2) {
      const ex = memoria.conhecimentos.find(i => similaridade(i.pergunta, perguntaTemp) > 0.9);
      if (ex) ex.resposta = msg; else memoria.conhecimentos.push({ pergunta: perguntaTemp.toLowerCase().trim(), resposta: msg });
      salvarMemoria();
      modoAprendizado = false; etapaAprendizado = 0; perguntaTemp = "";
      jadeDiz("Perfeito, Mestre! Aprendi! Mesmo que você escreva de um jeito parecido, eu vou entender.", "Perfeito, Mestre! Aprendi!");
      return;
    }
  }

  if (/\b(te ensinar|ensinar (?:voce|algo|uma coisa|uma resposta)|quero ensinar|vou ensinar|modo aprendizado)\b/.test(t) && !/\b(sabe|aprendeu)\b/.test(t)) {
    modoAprendizado = true; etapaAprendizado = 1;
    jadeDiz("Com certeza, Mestre! Qual pergunta ou frase eu devo aprender? (digite <i>cancelar</i> para sair)", "Com certeza, Mestre! Qual pergunta ou frase eu devo aprender?");
    return;
  }

  ctx.msgs++;
  const pensando = escrever("<span class='digitando'>digitando...</span>", "jade");
  let resposta;
  try { resposta = await pensar(msg); } catch (e) { resposta = "Tive um pequeno erro interno, Mestre. Pode repetir?"; }
  pensando.remove();
  if (resposta) { escrever(resposta, "jade"); falar(resposta); }
}

/* ================= RECONHECIMENTO DE VOZ ================= */
function iniciarGravacao(e) {
  if (e) e.preventDefault();
  const S = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!S) { alert("Seu navegador não suporta reconhecimento de voz."); return; }
  if (gravacaoAtiva) return;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  rec = new S(); rec.lang = "pt-BR"; rec.continuous = true; rec.interimResults = true;
  rec.onstart = () => { gravacaoAtiva = true; btnMic.classList.add("recording"); };
  rec.onresult = ev => {
    let s = ""; for (let i = 0; i < ev.results.length; i++) s += ev.results[i][0].transcript;
    inputEl.value = s;
  };
  rec.onerror = () => pararGravacao();
  rec.start();
}
function pararGravacao(e) {
  if (e) e.preventDefault();
  if (!gravacaoAtiva) return;
  gravacaoAtiva = false; btnMic.classList.remove("recording");
  if (rec) { rec.stop(); setTimeout(() => { if (inputEl.value.trim()) enviar(); }, 400); }
}

if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
