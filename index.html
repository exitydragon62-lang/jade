<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jade - Sistema 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background-color: #0d0d11;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Painel HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            padding: 18px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 10;
            pointer-events: none;
            min-width: 280px;
        }

        #status-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        #status-mode {
            font-weight: 800;
            font-size: 1.1em;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .active-bg {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
        }

        .inactive-bg {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .instructions {
            font-size: 0.85em;
            color: #a0a0b0;
            line-height: 1.6;
        }

        .key {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>

    <!-- Libs do Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>

    <div id="hud">
        <div id="status-container">
            <span>MODO 3D:</span>
            <span id="status-mode" class="active-bg">ATIVO</span>
        </div>
        <div class="instructions">
            • Pressiona <span class="key">Y</span> para Ativar / Desativar o Modo 3D<br>
            • Pressiona <span class="key">T</span> para gerar/remover o <b>Bracelete Geométrico</b><br>
            • Com o Modo 3D Ativo: Digita para criar Texto 3D<br>
            • <span class="key">Backspace</span> Apaga texto | <span class="key">Espaço</span> Limpa texto
        </div>
    </div>

    <script>
        // Estado do Sistema
        let is3DActive = true;
        let currentText = "";
        let textMesh = null;
        let loadedFont = null;
        let braceletGroup = null;

        // 1. Configuração do Cenário Limpo
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00ff88, 2, 80);
        pointLight1.position.set(15, 20, 15);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xffd700, 1.5, 80);
        pointLight2.position.set(-15, -10, 15);
        scene.add(pointLight2);

        camera.position.set(0, 0, 30);

        // 3. Função para Alternar o Bracelete Geométrico (Acionada com 'T')
        function toggleBracelet() {
            if (braceletGroup) {
                // Se já existe, remove da tela
                scene.remove(braceletGroup);
                braceletGroup = null;
            } else {
                // Se não existe, cria e adiciona à tela
                braceletGroup = new THREE.Group();

                const goldMaterial = new THREE.MeshStandardMaterial({
                    color: 0xd4af37,
                    metalness: 0.9,
                    roughness: 0.15
                });

                // Anel principal
                const ringGeometry = new THREE.TorusGeometry(6, 0.6, 16, 100); 
                const mainRing = new THREE.Mesh(ringGeometry, goldMaterial);
                braceletGroup.add(mainRing);

                // Fusão com Formas Quadradas/Cúbicas
                const boxGeometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const box = new THREE.Mesh(boxGeometry, goldMaterial);
                    box.position.x = Math.cos(angle) * 6;
                    box.position.y = Math.sin(angle) * 6;
                    box.rotation.z = angle;
                    box.rotation.x = Math.PI / 4;
                    braceletGroup.add(box);
                }

                scene.add(braceletGroup);
            }
        }

        // 4. Carregamento de Fonte
        const loader = new THREE.FontLoader();
        loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function (font) {
            loadedFont = font;
        });

        // Atualizar/Criar o Texto 3D na Tela
        function update3DText() {
            if (!loadedFont) return;

            if (textMesh) {
                scene.remove(textMesh);
                textMesh.geometry.dispose();
                textMesh = null;
            }

            if (currentText.length === 0) return;

            const textGeometry = new THREE.TextGeometry(currentText, {
                font: loadedFont,
                size: 1.8,
                height: 0.5,
                curveSegments: 10,
                bevelEnabled: true,
                bevelThickness: 0.08,
                bevelSize: 0.04,
                bevelSegments: 4
            });

            textGeometry.center();

            const textMaterial = new THREE.MeshStandardMaterial({
                color: is3DActive ? 0x00ff88 : 0x555555,
                metalness: 0.5,
                roughness: 0.2
            });

            textMesh = new THREE.Mesh(textGeometry, textMaterial);
            textMesh.position.y = braceletGroup ? -9 : 0; // Ajusta posição se o bracelete estiver ativo
            scene.add(textMesh);
        }

        // 5. Escutador do Teclado
        window.addEventListener('keydown', (event) => {
            // Tecla Y: Alterna Ativar/Desativar Modo 3D
            if (event.key === 'y' || event.key === 'Y') {
                is3DActive = !is3DActive;
                const statusEl = document.getElementById('status-mode');
                
                if (is3DActive) {
                    statusEl.innerText = "ATIVO";
                    statusEl.className = "active-bg";
                } else {
                    statusEl.innerText = "DESATIVADO";
                    statusEl.className = "inactive-bg";
                }
                
                update3DText();
                return;
            }

            // Tecla T: Gera/Remove o Bracelete 3D
            if (event.key === 't' || event.key === 'T') {
                toggleBracelet();
                if (textMesh) update3DText(); // Recalcula a posição do texto se ele existir
                return;
            }

            // Se o Modo 3D estiver DESATIVADO, não digita nem altera nada
            if (!is3DActive) return;

            // Digitação do Texto 3D
            if (event.key === 'Backspace') {
                currentText = currentText.slice(0, -1);
            } else if (event.key === ' ') {
                currentText = ""; 
            } else if (event.key.length === 1) {
                currentText += event.key.toUpperCase();
            }

            update3DText();
        });

        // 6. Animação
        function animate() {
            requestAnimationFrame(animate);

            // Rotação do Bracelete (se estiver acionado)
            if (braceletGroup) {
                braceletGroup.rotation.y += 0.01;
                braceletGroup.rotation.x += 0.005;
            }

            // Rotação do Texto
            if (textMesh) {
                textMesh.rotation.y = Math.sin(Date.now() * 0.001) * 0.3;
            }

            renderer.render(scene, camera);
        }

        animate();

        // Redimensionamento da Tela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
