<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jade IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121214;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 100%;
      max-width: 500px;
      background: #1e1e24;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .chat-box {
      height: 350px;
      overflow-y: auto;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .msg {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
    }
    .jade { background-color: #2b1f3d; color: #d8b4fe; }
    .mestre { background-color: #4c1d95; color: #fff; text-align: right; }
    .input-area { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #121214;
      color: #fff;
    }
    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background: #7c3aed;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #6d28d9; }
  </style>
</head>
<body>

  <div class="chat-container">
    <h2>Jade IA</h2>
    <div class="chat-box" id="chatBox">
      <div class="msg jade">Jade: Olá, Mestre! Eu sou a Jade. Como posso ajudar?</div>
    </div>
    
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Digite sua mensagem, Mestre...">
      <button onclick="enviarMensagem()">Enviar</button>
    </div>
  </div>

  <script>
    // Altere para a sua API Key se não quiser digitar no navegador
    let API_KEY = localStorage.getItem("GEMINI_KEY") || "";

    if (!API_KEY) {
      API_KEY = prompt("Mestre, por favor insira a sua Gemini API Key:");
      if (API_KEY) {
        localStorage.setItem("GEMINI_KEY", API_KEY);
      }
    }

    async function enviarMensagem() {
      const input = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const mensagem = input.value.trim();

      if (!mensagem) return;

      // Exibe mensagem do Mestre no Chat
      chatBox.innerHTML += `<div class="msg mestre">Mestre: ${mensagem}</div>`;
      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      if (!API_KEY) {
        chatBox.innerHTML += `<div class="msg jade">Jade: Nenhuma API Key foi fornecida. Insira uma chave válida!</div>`;
        return;
      }

      // Endpoint oficial atualizado (Gemini 2.5 Flash)
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: mensagem }] }]
          })
        });

        const data = await response.json();

        if (response.ok) {
          const respostaJade = data.candidates[0].content.parts[0].text;
          chatBox.innerHTML += `<div class="msg jade">Jade: ${respostaJade}</div>`;
        } else {
          console.error(data);
          chatBox.innerHTML += `<div class="msg jade">Jade: Mestre, o servidor respondeu com um erro (código ${response.status}).</div>`;
        }
      } catch (error) {
        console.error(error);
        chatBox.innerHTML += `<div class="msg jade">Jade: Ocorreu um erro ao conectar à rede.</div>`;
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
