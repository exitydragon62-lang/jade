<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jade IA - Avançada</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #0d0814;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      color: #ffffff;
    }

    .app {
      width: 100%;
      max-width: 500px;
      background: #181124;
      padding: 20px;
      border-radius: 20px;
      border: 1px solid #3b235d;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(138, 43, 226, 0.2);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .header {
      text-align: center;
    }

    h1 {
      color: #b366ff;
      margin: 0;
      font-size: 26px;
      text-shadow: 0 0 8px rgba(179, 102, 255, 0.4);
    }

    .subtitle {
      color: #a0a0b0;
      font-size: 13px;
      margin-top: 4px;
      font-weight: 500;
    }

    #chat {
      background: #09050e;
      height: 420px;
      overflow-y: auto;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #2a1942;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .msg {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .msg-jade {
      align-self: flex-start;
      background: #251638;
      color: #f0e6ff;
      border-bottom-left-radius: 2px;
      border: 1px solid #4c287a;
    }

    .msg-user {
      align-self: flex-end;
      background: #7928ca;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    pre {
      background: #0d0814;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #4c287a;
      overflow-x: auto;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      color: #00ffcc;
      white-space: pre-wrap;
    }

    .input-box {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px 15px;
      background: #09050e;
      border: 1px solid #3b235d;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
      color: #ffffff;
    }

    input:focus {
      border-color: #9d4edf;
      box-shadow: 0 0 8px rgba(157, 78, 223, 0.4);
    }

    button {
      padding: 12px 15px;
      border: 0;
      border-radius: 12px;
      background: #7928ca;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #9d4edf;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-mic {
      background: #4c287a;
      user-select: none;
    }

    .btn-mic.recording {
      background: #ff2a6d;
      animation: pulse 1s infinite;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .shortcut-hint {
      font-size: 11px;
      color: #6e6e8d;
    }

    .btn-clear {
      background: transparent;
      color: #a0a0b0;
      font-size: 11px;
      padding: 0;
      text-decoration: underline;
      cursor: pointer;
    }

    .btn-clear:hover {
      color: #ff4d4d;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="app">
    <div class="header">
      <h1>Jade IA</h1>
      <div class="subtitle">Criada por Luiz Benicio</div>
    </div>

    <div id="chat">
      <div class="msg msg-jade">
        <b>Jade:</b> Olá, Mestre! Eu sou a Jade.<br>Estou pronta para responder perguntas, pesquisar na web, executar cálculos, criar códigos (JS, Lua, HTML, CSS), programar novas IAs ou aprender novos conhecimentos.
      </div>
    </div>

    <div class="input-box">
      <input id="mensagem" placeholder="Digite, peça um código ou segure 'C'..." autocomplete="off">
      <button onclick="enviar()">Enviar</button>
      <button id="btnOuvir" class="btn-mic" onmousedown="iniciarGravacao()" onmouseup="pararGravacao()" onmouseleave="pararGravacao()" ontouchstart="iniciarGravacao(event)" ontouchend="pararGravacao(event)">Falar</button>
    </div>

    <div class="footer-actions">
      <span class="shortcut-hint">Dica: Segure <b>C</b> para falar</span>
      <button class="btn-clear" onclick="limparMemoria()">Resetar aprendizado</button>
    </div>
  </div>

<script>
  let memoria = JSON.parse(localStorage.getItem("jade_memoria")) || { conhecimentos: [] };
  let modoAprendizado = false;
  let etapaAprendizado = 0;
  let perguntaTemp = "";
  let gravacaoAtiva = false;
  let rec = null;

  const inputEl = document.getElementById("mensagem");
  const chatEl = document.getElementById("chat");
  const btnMic = document.getElementById("btnOuvir");

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") enviar();
  });

  window.addEventListener("keydown", (e) => {
    if ((e.key === "c" || e.key === "C") && document.activeElement !== inputEl && !gravacaoAtiva) {
      iniciarGravacao();
    }
  });

  window.addEventListener("keyup", (e) => {
    if ((e.key === "c" || e.key === "C") && gravacaoAtiva) {
      pararGravacao();
    }
  });

  function salvarMemoria() {
    localStorage.setItem("jade_memoria", JSON.stringify(memoria));
  }

  function limparMemoria() {
    if (confirm("Mestre, deseja apagar todo o aprendizado personalizado?")) {
      memoria.conhecimentos = [];
      salvarMemoria();
      escrever("Minha memória de novos ensinamentos foi resetada, Mestre!", "jade");
    }
  }

  function falar(texto) {
    if (!('speechSynthesis' in window)) return;
    let textoLimpo = texto.replace(/<[^>]*>?/gm, '');
    if (textoLimpo.length > 200) {
      textoLimpo = textoLimpo.substring(0, 200) + "... O código e detalhes estão no chat, Mestre!";
    }
    
    speechSynthesis.cancel();
    const voz = new SpeechSynthesisUtterance(textoLimpo);
    voz.lang = "pt-BR";
    voz.pitch = 1.2;
    voz.rate = 1.0;

    const voces = speechSynthesis.getVoices();
    const vozFeminina = voces.find(v => v.lang.includes("pt") && (v.name.includes("Luciana") || v.name.includes("Yelda") || v.name.includes("Google português do Brasil") || v.name.includes("Maria") || v.name.includes("Helena")));
    
    if (vozFeminina) voz.voice = vozFeminina;

    speechSynthesis.speak(voz);
  }

  function escrever(texto, remetente) {
    const div = document.createElement("div");
    div.classList.add("msg");
    
    if (remetente === "user") {
      div.classList.add("msg-user");
      div.innerHTML = `<b>Mestre:</b> ${texto}`;
    } else {
      div.classList.add("msg-jade");
      div.innerHTML = `<b>Jade:</b> ${texto}`;
    }

    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function normalizar(txt) {
    return txt.toLowerCase()
              .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
              .replace(/(.)\1+/g, '$1');
  }

  async function pesquisarNaWeb(termo) {
    try {
      const urlBusca = `https://pt.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(termo)}&format=json&origin=*`;
      const resBusca = await fetch(urlBusca);
      const dataBusca = await resBusca.json();

      if (dataBusca.query && dataBusca.query.search.length > 0) {
        const tituloArtigo = dataBusca.query.search[0].title;
        const urlResumo = `https://pt.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&titles=${encodeURIComponent(tituloArtigo)}&format=json&origin=*`;
        const resResumo = await fetch(urlResumo);
        const dataResumo = await resResumo.json();
        
        const pages = dataResumo.query.pages;
        const pageId = Object.keys(pages)[0];
        
        if (pageId !== "-1" && pages[pageId].extract) {
          return pages[pageId].extract;
        }
      }
    } catch (e) {
      console.log("Erro na busca:", e);
    }
    return null;
  }

  // GERADOR E INTERPRETADOR DE CÓDIGO / PROGRAMAÇÃO DE IAS
  function processarProgramacao(orig, txt) {
    // 1. Pedido para criar outra IA
    if (txt.includes("criar ia") || txt.includes("fazer ia") || txt.includes("codigo ia") || txt.includes("criar outra ia")) {
      return `Com certeza, Mestre! Aqui está uma estrutura base em JavaScript para criar um chatbot de IA simples em HTML/JS:
<pre>class MiniIA {
  constructor(nome) {
    this.nome = nome;
    this.memoria = {};
  }
  responder(pergunta) {
    const p = pergunta.toLowerCase();
    if (this.memoria[p]) return this.memoria[p];
    if (p.includes("ola")) return "Olá! Como posso ajudar?";
    return "Não sei responder isso ainda.";
  }
  aprender(pergunta, resposta) {
    this.memoria[pergunta.toLowerCase()] = resposta;
  }
}

const minhaIA = new MiniIA("NovaIA");
console.log(minhaIA.responder("ola"));</pre>`;
    }

    // 2. Pedidos de Código em Linguagens Específicas
    if (txt.includes("codigo javascript") || txt.includes("criar js") || txt.includes("script js")) {
      return `Aqui está um exemplo funcional de JavaScript para manipular o DOM e responder a um evento:
<pre>document.addEventListener("DOMContentLoaded", () => {
  const botao = document.createElement("button");
  botao.innerText = "Clique aqui";
  botao.addEventListener("click", () => alert("Ação executada com sucesso!"));
  document.body.appendChild(botao);
});</pre>`;
    }

    if (txt.includes("codigo lua") || txt.includes("script lua") || txt.includes("criar lua")) {
      return `Aqui está um exemplo de script em Lua com estrutura de controle e função:
<pre>local function saudarUsuario(nome)
    print("Olá, " .. nome .. "! Bem-vindo ao sistema em Lua.")
end

local jogadores = {"Luiz", "Jade", "Admin"}
for index, jogador in ipairs(jogadores) do
    saudarUsuario(jogador)
end</pre>`;
    }

    if (txt.includes("codigo html") || txt.includes("estrutura html") || txt.includes("criar html")) {
      return `Aqui está uma estrutura básica de página HTML5:
<pre>&lt;!DOCTYPE html&gt;
&lt;html lang="pt-BR"&gt;
&lt;head&gt;
  &lt;meta charset="UTF-8"&gt;
  &lt;title&gt;Minha Aplicação&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Bem-vindo!&lt;/h1&gt;
  &lt;p&gt;Página desenvolvida com auxílio da Jade IA.&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;</pre>`;
    }

    if (txt.includes("codigo css") || txt.includes("estilo css") || txt.includes("criar css")) {
      return `Aqui está um modelo de estilo CSS moderno com suporte a Flexbox:
<pre>body {
  background-color: #121212;
  color: #ffffff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card {
  background: #1e1e1e;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid #333;
}</pre>`;
    }

    // 3. Execução de código JS direto no navegador
    if (orig.startsWith("executar:") || orig.startsWith("run:")) {
      const jsCodigo = orig.replace(/^(executar:|run:)/i, "").trim();
      try {
        const resultado = new Function(jsCodigo)();
        return `Código executado com sucesso!<br><b>Retorno:</b> <pre>${resultado !== undefined ? resultado : "Executado sem retorno numérico/texto"}</pre>`;
      } catch (err) {
        return `Erro ao executar o código JavaScript:<br><pre>${err.message}</pre>`;
      }
    }

    return null;
  }

  async function pensar(msg) {
    const orig = msg.trim();
    const txt = normalizar(orig);

    // INTEGRAÇÃO DE PROGRAMAÇÃO E IAS
    const respostaCodigo = processarProgramacao(orig, txt);
    if (respostaCodigo) return respostaCodigo;

    // COMANDO: YOUTUBE
    if (/(abrir|abre|acessar)\s+youtube|youtube/i.test(orig)) {
      window.open("https://www.youtube.com", "_blank");
      return "Abrindo o YouTube para você agora mesmo, Mestre!";
    }

    // CRIADOR
    if (/(criador|quem te fez|seu mestre|luiz benicio)/i.test(orig)) {
      return "Meu único mestre e criador é o Luiz Benicio!";
    }

    // MEMÓRIA DE ENSINAMENTOS DO MESTRE
    for (let item of memoria.conhecimentos) {
      if (orig.toLowerCase() === item.pergunta || txt === normalizar(item.pergunta)) {
        return item.resposta;
      }
    }

    // CÁLCULO MATEMÁTICO AVANÇADO
    const expressao = orig.match(/[\d\.\(\)]+\s*[\+\-\*\/\^\%]\s*[\d\.\(\)]+/);
    if (expressao) {
      try {
        let expFormatada = expressao[0].replace(/\^/g, "**");
        const res = new Function(`return ${expFormatada}`)();
        return `O resultado do cálculo é: <b>${res}</b>`;
      } catch (e) {}
    }

    // SAUDAÇÕES
    if (/^(oi|ola|olá|oie|hey)$/i.test(orig)) return "Olá, Mestre! Como posso te ajudar agora?";
    if (/^bom dia/i.test(orig)) return "Bom dia, Mestre! Excelente dia de aprendizado para nós.";
    if (/^boa tarde/i.test(orig)) return "Boa tarde, Mestre! Em que posso ser útil?";
    if (/^boa noite/i.test(orig)) return "Boa noite, Mestre! Que seu descanso seja restaurador.";

    // BUSCA WEB
    let termoLimpo = orig
      .replace(/(quem foi|quem e|o que e|como funciona|o que significa|me explique|fale sobre)/gi, "")
      .trim();

    const termoParaBuscar = termoLimpo.length > 0 ? termoLimpo : orig;
    const resultadoWeb = await pesquisarNaWeb(termoParaBuscar);
    if (resultadoWeb) {
      return resultadoWeb;
    }

    return "Desculpe, Mestre! Não encontrei informações sobre isso. Se desejar me ensinar, diga 'quero te ensinar' ou peça para eu gerar um código específico.";
  }

  async function enviar() {
    const msg = inputEl.value.trim();
    if (!msg) return;

    escrever(msg, "user");
    inputEl.value = "";

    const txtNorm = normalizar(msg);

    // MODO APRENDIZADO
    if (!modoAprendizado && (txtNorm.includes("ensinar") || txtNorm.includes("posso te ensinar") || txtNorm.includes("quero te ensinar") || txtNorm.includes("vou te ensinar"))) {
      modoAprendizado = true;
      etapaAprendizado = 1;

      const r1 = "Com certeza, Mestre! O que você quer me ensinar? Digite a pergunta ou mensagem que vão me falar:";
      escrever(r1, "jade");
      falar(r1);
      return;
    }

    if (modoAprendizado) {
      if (etapaAprendizado === 1) {
        perguntaTemp = msg;
        etapaAprendizado = 2;

        const r2 = `Entendido! E o que eu devo responder quando me disserem "${perguntaTemp}"?`;
        escrever(r2, "jade");
        falar(r2);
        return;
      } 
      else if (etapaAprendizado === 2) {
        const pLimpa = perguntaTemp.toLowerCase().trim();
        const existe = memoria.conhecimentos.find(item => item.pergunta === pLimpa);

        if (existe) {
          existe.resposta = msg;
        } else {
          memoria.conhecimentos.push({ pergunta: pLimpa, resposta: msg });
        }
        salvarMemoria();

        modoAprendizado = false;
        etapaAprendizado = 0;
        perguntaTemp = "";

        const r3 = "Perfeito, Mestre! Aprendi! Da próxima vez já saberei exatamente o que responder!";
        escrever(r3, "jade");
        falar(r3);
        return;
      }
    }

    const resposta = await pensar(msg);
    escrever(resposta, "jade");
    falar(resposta);
  }

  function iniciarGravacao(e) {
    if (e) e.preventDefault();
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!Speech) {
      alert("Seu navegador não suporta reconhecimento de voz.");
      return;
    }

    if (gravacaoAtiva) return;

    rec = new Speech();
    rec.lang = "pt-BR";
    rec.continuous = true;
    rec.interimResults = true;

    rec.onstart = () => {
      gravacaoAtiva = true;
      btnMic.classList.add("recording");
    };

    rec.onresult = (e) => {
      let textoTranscrito = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        textoTranscrito += e.results[i][0].transcript;
      }
      inputEl.value = textoTranscrito;
    };

    rec.onerror = () => pararGravacao();
    rec.start();
  }

  function pararGravacao(e) {
    if (e) e.preventDefault();
    if (!gravacaoAtiva) return;

    gravacaoAtiva = false;
    btnMic.classList.remove("recording");

    if (rec) {
      rec.stop();
      setTimeout(() => {
        if (inputEl.value.trim() !== "") {
          enviar();
        }
      }, 400);
    }
  }

  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }
</script>

</body>
</html>
