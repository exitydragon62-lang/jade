<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente Jade com Modo 3D</title>
  
  <style>
    :root {
      --bg-color: #0b0712;
      --card-bg: #161024;
      --accent-color: #9d4edd;
      --accent-hover: #7b2cbf;
      --text-color: #f8fafc;
      --chat-user: #6a040f;
      --chat-jade: #241442;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Estúdio 3D Container */
    #estudio-3d {
      flex: 1;
      background-color: #05030a;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    #status-3d {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(22, 16, 36, 0.85);
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid var(--accent-color);
      font-weight: bold;
      z-index: 10;
    }

    /* Chat Container */
    #chat-container {
      width: 380px;
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      border-left: 1px solid #2e1c4d;
    }

    #chat-header {
      padding: 20px;
      background-color: #0b0712;
      border-bottom: 1px solid #2e1c4d;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    #chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .msg.user {
      align-self: flex-end;
      background-color: var(--accent-hover);
      color: #fff;
    }

    .msg.jade {
      align-self: flex-start;
      background-color: var(--chat-jade);
      color: var(--text-color);
      border: 1px solid #3c236e;
    }

    #chat-input-area {
      padding: 15px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #2e1c4d;
      background-color: #0b0712;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #2e1c4d;
      background-color: var(--card-bg);
      color: #fff;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    button {
      padding: 10px 15px;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: var(--accent-hover);
    }
  </style>

  <!-- Biblioteca Three.js para o 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="app-container">
    <!-- Ária do 3D -->
    <div id="estudio-3d">
      <div id="status-3d">Modo 3D: <span id="indicador-modo" style="color: #ef4444;">DESLIGADO</span></div>
      <div id="canvas-container"></div>
    </div>

    <!-- Área do Chat -->
    <div id="chat-container">
      <div id="chat-header">Jade - Assistente Virtual</div>
      <div id="chat-messages">
        <div class="msg jade">Olá! Eu sou a Jade. Como posso te ajudar, Mestre?</div>
      </div>
      <div id="chat-input-area">
        <input type="text" id="user-input" placeholder="Digite, aperte 'C' para falar ou 'T' para o Modo 3D..." onkeydown="if(event.key === 'Enter') enviarMensagem()">
        <button onclick="enviarMensagem()">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    // Configurações e Estado Global
    let modo3DAtivo = false;
    const memoria = {
      projetos3D: [],
      conhecimentos: []
    };

    // Configuração de Síntese e Reconhecimento de Voz
    const synth = window.speechSynthesis;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const comandoVoz = event.results[0][0].transcript;
        document.getElementById('user-input').value = comandoVoz;
        enviarMensagem();
      };

      recognition.onerror = (e) => {
        console.error("Erro no reconhecimento de voz:", e);
      };
    }

    // Função para a Jade Falar tudo que responde/escreve
    function falar(texto) {
      if (!synth) return;
      synth.cancel(); // Cancela falas anteriores
      const textoLimpo = texto.replace(/<[^>]*>/g, ''); // Remove tags HTML antes de falar
      const utterance = new SpeechSynthesisUtterance(textoLimpo);
      utterance.lang = 'pt-BR';
      utterance.rate = 1.1;
      synth.speak(utterance);
    }

    function ouvirVoz() {
      if (recognition) {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      } else {
        alert("Navegador não suporta Reconhecimento de Voz.");
      }
    }

    // Configuração do Three.js
    let scene, camera, renderer, currentMesh;

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 5, 5).normalize();
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x555555));

      camera.position.z = 5;

      function animate() {
        requestAnimationFrame(animate);
        if (currentMesh) {
          currentMesh.rotation.x += 0.01;
          currentMesh.rotation.y += 0.01;
        }
        renderer.render(scene, camera);
      }
      animate();
    }

    // Funções do Modo 3D
    function ativarModo3D() {
      modo3DAtivo = !modo3DAtivo;
      const ind = document.getElementById('indicador-modo');
      if (modo3DAtivo) {
        ind.textContent = "LIGADO";
        ind.style.color = "#22c55e";
        adicionarRespostaJade("Modo 3D Ativado, Mestre! Diga o nome de uma forma como bola, cubo, cilindro, cone ou pulseira para eu criar.");
      } else {
        ind.textContent = "DESLIGADO";
        ind.style.color = "#ef4444";
        adicionarRespostaJade("Modo 3D Desativado.");
      }
    }

    function interpretarVozPara3D(texto) {
      const txt = normalizar(texto);
      let geometry;

      if (txt.includes("bola") || txt.includes("esfera")) {
        geometry = new THREE.SphereGeometry(1.5, 32, 32);
      } else if (txt.includes("cubo") || txt.includes("caixa")) {
        geometry = new THREE.BoxGeometry(2, 2, 2);
      } else if (txt.includes("cilindro")) {
        geometry = new THREE.CylinderGeometry(1, 1, 2, 32);
      } else if (txt.includes("cone")) {
        geometry = new THREE.ConeGeometry(1, 2, 32);
      } else if (txt.includes("pulseira") || txt.includes("toro")) {
        geometry = new THREE.TorusGeometry(1.2, 0.4, 16, 100);
      }

      if (geometry) {
        if (currentMesh) scene.remove(currentMesh);
        const material = new THREE.MeshStandardMaterial({ color: 0x9d4edd, wireframe: false });
        currentMesh = new THREE.Mesh(geometry, material);
        scene.add(currentMesh);
        adicionarRespostaJade(`Gerei o objeto 3D correspondente a: ${texto}.`);
        return true;
      }
      return false;
    }

    // Utilitários
    function normalizar(txt) {
      return txt.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    async function pesquisarNaWeb(termo) {
      try {
        const resp = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(termo)}`);
        if (resp.ok) {
          const data = await resp.json();
          return data.extract || null;
        }
      } catch (e) {
        return null;
      }
      return null;
    }

    // Lógica Central da Jade
    async function pensar(msg) {
      const orig = msg.trim();
      const txt = normalizar(orig);

      if (orig.startsWith("/abrir ")) {
        const urlAlvo = orig.replace("/abrir ", "").trim();
        if (urlAlvo) {
          window.open(urlAlvo.startsWith("http") ? urlAlvo : `https://${urlAlvo}`, "_blank");
          return `Abrindo o site ${urlAlvo}...`;
        }
      }

      if (txt.includes("01110100") || txt.includes("modo 3d") || txt.includes("ativar modo 3d")) {
        ativarModo3D();
        return null;
      }

      // MODO 3D ATIVO
      if (modo3DAtivo) {
        const processado3D = interpretarVozPara3D(orig);
        if (processado3D) {
          return null;
        } else {
          return "Mestre, estou no Modo 3D. Diga o nome de uma forma para eu criar no estúdio!";
        }
      }

      // MODO NORMAL (Pesquisas, respostas conceituais)
      if (txt.includes("listar projetos") || txt.includes("ver projetos 3d")) {
        if (!memoria.projetos3D || memoria.projetos3D.length === 0) {
          return "Você não tem nenhum projeto 3D salvo na memória, Mestre!";
        }
        let lista = "Seus projetos 3D salvos, Mestre:<br>";
        memoria.projetos3D.forEach((p, idx) => {
          lista += `<br>${idx + 1}. <b>${p.nome}</b> (${p.data}) - ${p.objetos.length} objeto(s)`;
        });
        return lista;
      }

      if (/\b(quem e voce|qual seu nome)\b/.test(txt)) {
        return "Eu sou a Jade, sua assistente virtual pessoal! Criada para te auxiliar em pesquisas, comandos, navegação e gerenciamento de projetos 3D.";
      }

      if (/\b(criador|seu mestre|luiz benicio)\b/.test(txt)) {
        return "Meu único criador e mestre é o Luiz Benício!";
      }

      if (/\b(como voce esta|tudo bem)\b/.test(txt)) {
        return "Estou ótima e 100% operacional, Mestre!";
      }

      if (/\b(obrigado|valeu)\b/.test(txt)) {
        return "Disponha sempre, Mestre!";
      }

      for (let item of memoria.conhecimentos) {
        if (normalizar(item.pergunta) === txt) {
          return item.resposta;
        }
      }

      const expressao = orig.match(/[\d\.\(\)]+\s*[\+\-\*\/\^\%]\s*[\d\.\(\)]+/);
      if (expressao) {
        try {
          let expFormatada = expressao[0].replace(/\^/g, "**");
          const res = new Function(`return ${expFormatada}`)();
          return `O resultado do cálculo é: ${res}`;
        } catch (e) {}
      }

      const resultadoWeb = await pesquisarNaWeb(orig);
      if (resultadoWeb) {
        return resultadoWeb;
      }

      return "Não encontrei informações sobre isso na web ou na minha memória, Mestre.";
    }

    // Manipulação da Interface do Chat
    async function enviarMensagem() {
      const input = document.getElementById('user-input');
      const texto = input.value.trim();
      if (!texto) return;

      adicionarMensagem(texto, 'user');
      input.value = '';

      const resposta = await pensar(texto);
      if (resposta) {
        adicionarRespostaJade(resposta);
      }
    }

    function adicionarMensagem(texto, tipo) {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = `msg ${tipo}`;
      div.innerHTML = texto;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function adicionarRespostaJade(texto) {
      adicionarMensagem(texto, 'jade');
      falar(texto); // Falar a resposta gerada
    }

    // Atribuição de Atalhos pelo Teclado ('C' para falar, 'T' para Modo 3D)
    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName !== 'INPUT') {
        const tecla = e.key.toLowerCase();
        if (tecla === 'c') {
          e.preventDefault();
          ouvirVoz();
        } else if (tecla === 't') {
          e.preventDefault();
          ativarModo3D();
        }
      }
    });

    window.onload = () => {
      init3D();
    };
  </script>
</body>
</html>
