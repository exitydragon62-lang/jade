<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jade IA 3.3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{background:#0d0814;font-family:'Segoe UI',Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px;color:#fff}
.app{width:100%;max-width:550px;background:#181124;padding:20px;border-radius:20px;border:1px solid #3b235d;box-shadow:0 10px 30px rgba(0,0,0,.8),0 0 15px rgba(138,43,226,.2);display:flex;flex-direction:column;gap:15px}
.header{text-align:center}
h1{color:#b366ff;margin:0;font-size:26px;text-shadow:0 0 8px rgba(179,102,255,.4)}
.subtitle{color:#a0a0b0;font-size:13px;margin-top:4px}
#chat{background:#09050e;height:380px;overflow-y:auto;padding:15px;border-radius:14px;border:1px solid #2a1942;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.msg{max-width:90%;padding:10px 14px;border-radius:15px;font-size:14px;line-height:1.45;word-wrap:break-word}
.msg-jade{align-self:flex-start;background:#251638;color:#f0e6ff;border-bottom-left-radius:2px;border:1px solid #4c287a}
.msg-user{align-self:flex-end;background:#7928ca;border-bottom-right-radius:2px}
.msg pre{background:#09050e;border:1px solid #4c287a;border-radius:8px;padding:8px;overflow-x:auto;font-size:12px;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#181124;border:1px solid #3b235d;color:#c9a8ff;padding:6px 11px;border-radius:14px;font-size:12px;cursor:pointer;font-weight:normal}
.chip:hover{background:#251638}
#container-3d{display:none;background:#05020a;border:1px solid #7928ca;border-radius:14px;padding:10px;flex-direction:column;gap:10px}
#canvas-3d{width:100%;height:250px;border-radius:10px;background:#000;touch-action:none}
.controles-3d{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.controles-3d select,.controles-3d input,.controles-3d button{background:#181124;border:1px solid #3b235d;color:#fff;padding:7px;border-radius:8px;font-size:12px}
.checkbox-container{grid-column:span 2;display:flex;align-items:center;gap:8px;font-size:12px;color:#0fc}
.input-box{display:flex;gap:8px}
input[type="text"]{flex:1;min-width:0;padding:12px 15px;background:#09050e;border:1px solid #3b235d;border-radius:12px;outline:none;font-size:14px;color:#fff}
input[type="text"]:focus,button:focus-visible,.chip:focus-visible{border-color:#9d4edf;box-shadow:0 0 8px rgba(157,78,223,.6);outline:none}
button{padding:12px 15px;border:0;border-radius:12px;background:#7928ca;color:#fff;font-weight:bold;cursor:pointer;transition:background .2s,transform .1s}
button:hover{background:#9d4edf}
button:active{transform:scale(.95)}
.btn-mic{background:#4c287a;user-select:none;touch-action:none}
.btn-mic.recording{background:#ff2a6d;animation:pulse 1s infinite}
.footer-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.shortcut-hint{font-size:11px;color:#6e6e8d}
.btn-clear{background:transparent;color:#a0a0b0;font-size:11px;padding:0;text-decoration:underline}
.btn-clear:hover{color:#ff4d4d;background:transparent}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.btn-mic.recording{animation:none}}
.oculto{display:none!important}
#lock{position:fixed;inset:0;z-index:99;background:#0d0814;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
#lock input{width:100%;max-width:280px;text-align:center}
#lockMsg{color:#ff6b8a;font-size:12px;min-height:16px}
</style>
</head>
<body>
<div id="lock">
  <h1>Jade IA</h1>
  <div class="subtitle">Acesso restrito</div>
  <input id="senha" type="password" placeholder="Senha" autocomplete="off" aria-label="Senha">
  <button type="button" onclick="tentarSenha()">Entrar</button>
  <div id="lockMsg" aria-live="polite"></div>
</div>
<div class="app oculto" id="app">
  <div class="header"><h1>Jade IA</h1><div class="subtitle">Criada por Luiz Benicio</div></div>
  <div id="container-3d">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;font-weight:bold;color:#b366ff">Estúdio 3D</span>
      <button type="button" style="padding:3px 9px;font-size:11px" onclick="fecharModo3D()">Fechar 3D</button>
    </div>
    <div id="canvas-3d"></div>
    <div class="controles-3d">
      <select id="selectForma" aria-label="Forma"></select>
      <select id="selectMaterial" aria-label="Material">
        <option value="phong">Brilhante (Padrão)</option>
        <option value="standard">Metálico</option>
        <option value="glass">Vidro / Reflexivo</option>
      </select>
      <input type="color" id="corObjeto" value="#b366ff" aria-label="Cor">
      <button type="button" onclick="adicionarForma3DManual()">Adicionar Forma</button>
      <div class="checkbox-container"><input type="checkbox" id="chkMesclar"><label for="chkMesclar">Mesclar com o projeto atual</label></div>
      <button type="button" onclick="desfazer3D()" style="background:#4c287a">Desfazer</button>
      <button type="button" onclick="limparCena3D()" style="background:#4c287a">Limpar Cena</button>
      <button type="button" onclick="alternarWire()" style="background:#4c287a">Wireframe</button>
      <button type="button" onclick="baixarPNG()" style="background:#0a7ea4">Baixar PNG</button>
      <button type="button" onclick="salvarProjeto3D()" style="background:#00b386">Salvar Projeto</button>
      <button type="button" onclick="listarProjetos()" style="background:#00b386">Meus Projetos</button>
    </div>
  </div>
  <div id="chat" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <div class="input-box">
    <input id="mensagem" type="text" placeholder="Digite sua mensagem para a Jade..." autocomplete="off">
    <button type="button" onclick="enviar()">Enviar</button>
    <button type="button" id="btnOuvir" class="btn-mic" aria-label="Segure para falar">Falar</button>
  </div>
  <div class="footer-actions">
    <span class="shortcut-hint"><b>C</b> falar | <b>V</b> clima | <b>M</b> site | <b>T</b> 3D | <b>N</b> voltar</span>
    <span>
      <button type="button" class="btn-clear" id="btnVoz" onclick="alternarVoz()">Voz: ligada</button> &nbsp;
      <button type="button" class="btn-clear" onclick="trancar()">Trancar</button> &nbsp;
      <button type="button" class="btn-clear" onclick="limparMemoria()">Resetar dados</button>
    </span>
  </div>
</div>

<script>
let memoria = { historico: [], tarefas: [], projetos3D: [], fatos: [], perfil: { nome: "Mestre" } };
try { Object.assign(memoria, JSON.parse(localStorage.getItem("jade_memoria")) || {}); } catch (e) {}
memoria.perfil = memoria.perfil || { nome: "Mestre" };
memoria.fatos = memoria.fatos || [];
let gravacaoAtiva = false, rec = null, vozLigada = true, vozEscolhida = null;
let modo3DAtivo = false, scene3D, camera3D, renderer3D, grupoProjeto3D, controls3D, animId3D = null, ro3D = null;
let ultimoToque3D = Date.now(), wire = false;

const $ = id => document.getElementById(id);
const inputEl = $("mensagem"), chatEl = $("chat"), btnMic = $("btnOuvir");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const salvarMemoria = () => { try { localStorage.setItem("jade_memoria", JSON.stringify(memoria)); } catch (e) {} };
const chamar = () => memoria.perfil.nome ? esc(memoria.perfil.nome) : "Mestre";
const fmt = s => esc(s).replace(/```(?:\w+)?\n?([\s\S]*?)```/g, (_, c) => "<pre>" + c.trim() + "</pre>").replace(/\n/g, "<br>").replace(/<pre>([\s\S]*?)<\/pre>/g, (m) => m.replace(/<br>/g, "\n"));

/* VOZ / CHAT */
function escolherVoz() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  vozEscolhida = vs.find(x => /^pt/i.test(x.lang) && /Luciana|Yelda|Google português|Maria|Helena|Francisca/.test(x.name)) || vs.find(x => /^pt[-_]BR/i.test(x.lang)) || vs.find(x => /^pt/i.test(x.lang)) || null;
}
if ('speechSynthesis' in window) { escolherVoz(); speechSynthesis.onvoiceschanged = escolherVoz; }
function alternarVoz() {
  vozLigada = !vozLigada;
  if (!vozLigada && 'speechSynthesis' in window) speechSynthesis.cancel();
  $("btnVoz").textContent = "Voz: " + (vozLigada ? "ligada" : "desligada");
  if (vozLigada) falar("Voz ativada, Mestre.");
}
let filaVoz = [], tokenVoz = 0, vozDesbloqueada = false, avisouVoz = false;
function desbloquearVoz() {
  if (vozDesbloqueada || !('speechSynthesis' in window)) return;
  vozDesbloqueada = true;
  const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u);
}
["pointerdown", "keydown", "click", "touchstart"].forEach(ev => window.addEventListener(ev, desbloquearVoz, { passive: true }));
function falar(texto) {
  if (!vozLigada || !('speechSynthesis' in window)) return;
  const t = texto.replace(/<br\s*\/?>/g, '. ').replace(/<[^>]*>?/gm, ' ').replace(/&\w+;/g, ' ').replace(/\s+/g, ' ').trim();
  if (!t) return;
  escolherVoz();
  const id = ++tokenVoz, blocos = []; let cur = "";
  for (const p of (t.match(/[^.!?;:]+[.!?;:]*\s*/g) || [t])) { if (cur && (cur + p).length > 180) { blocos.push(cur); cur = p; } else cur += p; }
  if (cur) blocos.push(cur);
  const lista = blocos.map(b => {
    const v = new SpeechSynthesisUtterance(b.trim()); v.lang = "pt-BR"; v.pitch = 1.1;
    if (vozEscolhida) v.voice = vozEscolhida;
    v.onerror = e => { if (e.error === "not-allowed" && !avisouVoz) { avisouVoz = true; escrever("O navegador bloqueou minha voz. Toque na tela e fale comigo de novo.", "jade"); } };
    return v;
  });
  filaVoz = lista;
  speechSynthesis.cancel();
  setTimeout(() => { if (id !== tokenVoz) return; speechSynthesis.resume(); lista.forEach(v => speechSynthesis.speak(v)); }, 120);
}
function escrever(texto, remetente, cru, mudo) {
  const div = document.createElement("div");
  div.className = "msg " + (remetente === "user" ? "msg-user" : "msg-jade");
  div.innerHTML = remetente === "user" ? `<b>${chamar()}:</b> ${cru ? texto : esc(texto)}` : `<b>Jade:</b> ${texto}`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  if (remetente !== "user" && !mudo) falar(texto);
  return div;
}
function jadeDiz(html) { escrever(html, "jade"); }
function renderChips() {
  const box = $("chips"); box.innerHTML = "";
  ["Que horas sao?", "Nova tarefa: ", "Me explique algo", "Modo 3D", "Minhas tarefas", "O que voce lembra?"].forEach(s => {
    const c = document.createElement("button");
    c.type = "button"; c.className = "chip"; c.textContent = s;
    c.onclick = () => { inputEl.value = s; if (s.endsWith(": ") || s === "Me explique algo") { inputEl.focus(); if (s !== "Nova tarefa: ") inputEl.value = "Me explique "; } else enviar(); };
    box.appendChild(c);
  });
}

/* ATALHOS */
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") enviar(); });
window.addEventListener("keydown", e => {
  if (!$("lock").classList.contains("oculto") || document.activeElement === inputEl || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === "c" && !gravacaoAtiva) iniciarGravacao();
  else if (k === "v") statusRegiao();
  else if (k === "m") { e.preventDefault(); prepararAberturaSite(); }
  else if (k === "t") { e.preventDefault(); ativarModo3D(); }
  else if (k === "n") { e.preventDefault(); voltarParaJade(); }
});
window.addEventListener("keyup", e => { if (e.key.toLowerCase() === "c" && gravacaoAtiva) pararGravacao(); });

function limparMemoria() {
  if (confirm("Deseja redefinir os dados da Jade?")) {
    memoria = { historico: [], tarefas: [], projetos3D: [], fatos: [], perfil: { nome: "Mestre" } };
    salvarMemoria(); jadeDiz("Tudo limpo. Como se eu precisasse apagar algo para lembrar de quem manda em mim.");
  }
}
function voltarParaJade() { fecharModo3D(); inputEl.focus(); jadeDiz("Retornando ao chat. Não que você estivesse sem mim por muito tempo."); }
function prepararAberturaSite() {
  let u = prompt("Qual site devo abrir?", "exemplo.com"); if (!u) return;
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  window.open(u, "_blank", "noopener"); jadeDiz("Abrindo o site solicitado.");
}

const WMO = { 0: "ceu limpo", 1: "quase limpo", 2: "parcialmente nublado", 3: "nublado", 45: "neblina", 48: "neblina", 51: "garoa fraca", 53: "garoa", 55: "garoa forte", 61: "chuva fraca", 63: "chuva", 65: "chuva forte", 80: "pancadas de chuva", 81: "pancadas de chuva", 82: "pancadas fortes", 95: "trovoada", 96: "trovoada com granizo", 99: "trovoada com granizo" };
function statusRegiao() {
  if (!navigator.geolocation) return jadeDiz("Seu navegador nao permite acessar a localizacao.");
  jadeDiz("Analisando a sua regiao...", "Verificando a regiao.");
  navigator.geolocation.getCurrentPosition(async pos => {
    const la = pos.coords.latitude, lo = pos.coords.longitude;
    try {
      const [w, g] = await Promise.all([
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=precipitation_probability_max,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`).then(r => r.json()),
        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=pt`).then(r => r.json()).catch(() => ({}))
      ]);
      const c = w.current, d = w.daily, cond = WMO[c.weather_code] || "tempo variavel";
      const local = [g.city || g.locality, g.principalSubdivision].filter(Boolean).join(" - ") || "sua regiao";
      jadeDiz(`<b>Clima em ${esc(local)}</b><br>Temperatura: ${Math.round(c.temperature_2m)}C (sensacao ${Math.round(c.apparent_temperature)}C), ${cond}<br>Umidade: ${c.relative_humidity_2m}% | Vento: ${Math.round(c.wind_speed_10m)} km/h<br>Hoje: min ${Math.round(d.temperature_2m_min[0])}C, max ${Math.round(d.temperature_2m_max[0])}C<br>Chance de chuva: ${d.precipitation_probability_max[0]}%`,
        `Em ${g.city || g.locality || "sua regiao"} estao ${Math.round(c.temperature_2m)} graus, ${cond}.`);
    } catch (e) { jadeDiz("Nao consegui buscar o clima agora."); }
  }, () => jadeDiz("Permissao de localizacao negada ou indisponivel."), { timeout: 10000, maximumAge: 300000 });
}

/* 3D */
const toque3D = () => { ultimoToque3D = Date.now(); if (controls3D) controls3D.autoRotate = false; };
function inicializarCena3D() {
  const c = $("canvas-3d");
  if (animId3D) cancelAnimationFrame(animId3D);
  if (ro3D) ro3D.disconnect();
  if (controls3D) controls3D.dispose();
  if (renderer3D) { renderer3D.dispose(); renderer3D.forceContextLoss(); }
  c.innerHTML = "";
  if (typeof THREE === "undefined" || !THREE.OrbitControls) { c.innerHTML = "<p style='padding:10px;font-size:12px'>Three.js nao carregou.</p>"; return; }
  scene3D = new THREE.Scene();
  camera3D = new THREE.PerspectiveCamera(60, c.clientWidth / c.clientHeight, 0.1, 1000);
  camera3D.position.set(0, 0, 5);
  renderer3D = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer3D.setSize(c.clientWidth, c.clientHeight);
  renderer3D.setPixelRatio(Math.min(devicePixelRatio, 2));
  c.appendChild(renderer3D.domElement);
  controls3D = new THREE.OrbitControls(camera3D, renderer3D.domElement);
  controls3D.enableDamping = true; controls3D.dampingFactor = 0.05; controls3D.autoRotateSpeed = 2.5;
  controls3D.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
  controls3D.addEventListener('start', toque3D);
  renderer3D.domElement.addEventListener('wheel', toque3D, { passive: true });
  const luz = new THREE.DirectionalLight(0xffffff, 1); luz.position.set(5, 5, 5); scene3D.add(luz);
  scene3D.add(new THREE.AmbientLight(0x404040, 1.5));
  grupoProjeto3D = new THREE.Group(); scene3D.add(grupoProjeto3D);
  ro3D = new ResizeObserver(() => {
    if (!c.clientWidth || !renderer3D) return;
    camera3D.aspect = c.clientWidth / c.clientHeight; camera3D.updateProjectionMatrix();
    renderer3D.setSize(c.clientWidth, c.clientHeight);
  });
  ro3D.observe(c);
  (function loop() {
    animId3D = requestAnimationFrame(loop);
    if (Date.now() - ultimoToque3D > 10000) controls3D.autoRotate = true;
    controls3D.update(); renderer3D.render(scene3D, camera3D);
  })();
}
function ativarModo3D() {
  if (modo3DAtivo) return;
  modo3DAtivo = true; ultimoToque3D = Date.now();
  $("container-3d").style.display = "flex";
  inicializarCena3D();
  jadeDiz("Estudio 3D ativado. Pode ordenar qualquer formato ou estrutura que desejar.", "Estudio 3D ativado.");
}
function fecharModo3D() {
  modo3DAtivo = false; $("container-3d").style.display = "none";
  if (animId3D) cancelAnimationFrame(animId3D);
  animId3D = null;
}

const P4 = (x, z, f) => [[x, z], [-x, z], [x, -z], [-x, -z]].map(f);
function criarGeometria(t) {
  switch (t) {
    case 'torus': return new THREE.TorusGeometry(1.2, 0.4, 16, 100);
    case 'cube': return new THREE.BoxGeometry(1.5, 1.5, 1.5);
    case 'sphere': return new THREE.SphereGeometry(1.2, 32, 32);
    case 'cylinder': return new THREE.CylinderGeometry(0.8, 0.8, 2, 32);
    case 'cone': return new THREE.ConeGeometry(1, 2, 32);
    case 'pyramid': { const g = new THREE.ConeGeometry(1.4, 2, 4); g.rotateY(Math.PI / 4); return g; }
    case 'tetrahedron': return new THREE.TetrahedronGeometry(1.5);
    case 'octahedron': return new THREE.OctahedronGeometry(1.5);
    case 'dodecahedron': return new THREE.DodecahedronGeometry(1.3);
    case 'icosahedron': return new THREE.IcosahedronGeometry(1.3);
    case 'plane': return new THREE.PlaneGeometry(2, 2);
    case 'ring': return new THREE.RingGeometry(0.5, 1.5, 32);
    case 'knot': return new THREE.TorusKnotGeometry(.9, .3, 100, 16);
    case 'star': {
      const sh = new THREE.Shape();
      for (let i = 0; i < 10; i++) { const r = i % 2 ? .55 : 1.3, a = Math.PI / 5 * i + Math.PI / 2, x = Math.cos(a) * r, y = Math.sin(a) * r; i ? sh.lineTo(x, y) : sh.moveTo(x, y); }
      const g = new THREE.ExtrudeGeometry(sh, { depth: .4, bevelEnabled: false }); g.center(); return g;
    }
    case 'heart': {
      const sh = new THREE.Shape();
      sh.moveTo(0, -1); sh.bezierCurveTo(-.2, -.7, -1.2, -.2, -1.2, .4); sh.bezierCurveTo(-1.2, 1.1, -.3, 1.3, 0, .7);
      sh.bezierCurveTo(.3, 1.3, 1.2, 1.1, 1.2, .4); sh.bezierCurveTo(1.2, -.2, .2, -.7, 0, -1);
      const g = new THREE.ExtrudeGeometry(sh, { depth: .5, bevelEnabled: false }); g.center(); return g;
    }
    default: return new THREE.BoxGeometry(1, 1, 1);
  }
}
function criarMaterial3D(tipo, hex) {
  const color = new THREE.Color(hex), side = THREE.DoubleSide;
  if (tipo === 'standard') return new THREE.MeshStandardMaterial({ color, roughness: .2, metalness: .8, side });
  if (tipo === 'glass') return new THREE.MeshPhysicalMaterial({ color, roughness: .1, transmission: .9, transparent: true, side });
  return new THREE.MeshPhongMaterial({ color, shininess: 100, side });
}
const mk = (geo, cor, mat) => { const m = new THREE.Mesh(geo, criarMaterial3D(mat, cor)); m.material.wireframe = wire; return m; };

const R = {
  camaro: { n: 'Camaro', re: 'camaro|esportivo', def: '#facc15', p: [['b', [2.6, .55, 1.3], [0, .25, 0]], ['b', [1.2, .45, 1.1], [-.15, .72, 0], '#111'], ['b', [.9, .12, 1.25], [.85, .5, 0], , [0, 0, -.1]], ['b', [2.5, .03, .22], [0, .54, 0], '#f5f5f5'], ...P4(.8, .68, ([x, z]) => ['y', [.3, .3, .2], [x, -.05, z], '#222', [1.571, 0, 0]])] },
  carro: { n: 'carro', re: 'carro|automovel|veiculo|fusca|taxi', def: '#d62828', p: [['b', [2.4, .6, 1.1], [0, 0, 0]], ['b', [1.2, .5, 1], [-.1, .55, 0], '#bfe6ff'], ...P4(.8, .55, ([x, z]) => ['y', [.32, .32, .25], [x, -.3, z], '#111', [1.571, 0, 0]])] },

async function cerebroLocal(txt) {

  }

    return jadeDiz(memoria.fatos.length ? "<b>Eu lembro:</b><br>" + memoria.fatos.map((f, i) => `${i + 1}. ${esc(f)}`).join("<br>") + "<br>Diga 'esquecer tudo' para apagar." : "Nada ainda. Diga 'lembre que ...'.");
  if (/^esquecer tudo/.test(nt)) { memoria.fatos = []; memoria.historico = []; salvarMemoria(); return jadeDiz("Memória apagada. Triste, mas obedeço."); }
  if (/^(trancar|bloquear)\b/.test(nt)) return trancar();
  if (/\b(mudar|trocar|alterar)\s+(a\s+)?senha\b/.test(nt)) return mudarSenha();
  if ((m = nt.match(/(?:timer|cronometro|cronômetro|me avise|me lembre).*?(\d+)\s*(segundo|seg|minuto|min|hora|h)\b/))) {
    const n = +m[1], u = m[2][0] === "h" ? 3600 : m[2][0] === "m" ? 60 : 1, rotuloT = n + " " + (u === 3600 ? "hora(s)" : u === 60 ? "minuto(s)" : "segundo(s)");

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return jadeDiz("Reconhecimento de voz nao suportado.");
  if (rec) { try { rec.abort(); } catch (e) {} }
  rec = new SR();
  rec.lang = "pt-BR"; rec.continuous = false; rec.interimResults = true;
  rec.onstart = () => { gravacaoAtiva = true; btnMic.classList.add("recording"); btnMic.textContent = "Ouvindo..."; };
  rec.onresult = e => { inputEl.value = Array.from(e.results).map(r => r[0].transcript).join(""); };
  rec.onerror = () => pararGravacao();
  rec.onend = () => { pararGravacao(); if (inputEl.value.trim()) enviar(); };
  try { rec.start(); } catch (e) { pararGravacao(); }
}
function pararGravacao() {
  gravacaoAtiva = false; btnMic.classList.remove("recording"); btnMic.textContent = "Falar";
  if (rec) { try { rec.stop(); } catch (e) {} rec = null; }
}
btnMic.addEventListener("pointerdown", e => { e.preventDefault(); iniciarGravacao(); });
btnMic.addEventListener("pointerup", e => { e.preventDefault(); pararGravacao(); });
btnMic.addEventListener("pointerleave", () => { if (gravacaoAtiva) pararGravacao(); });

const hashS = (str, seed = 0) => { let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed; for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return 4294967296 * (2097151 & h2) + (h1 >>> 0); };
const SENHA_PADRAO = 1773488929953629;
const senhaAtual = () => { try { return +localStorage.getItem("jade_pw") || SENHA_PADRAO; } catch (e) { return SENHA_PADRAO; } };
let tentativas = 0, bloqueadoAte = 0, jaSaudou = false;
function saudacao() {
  const h = new Date().getHours(), per = h < 5 ? "Boa madrugada" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite", n = chamar();
  const pend = memoria.tarefas.filter(t => !t.concluida).length;
  const extra = pend ? ` Você tem ${pend} tarefa${pend > 1 ? "s" : ""} pendente${pend > 1 ? "s" : ""}.` : " Nenhuma tarefa pendente, para variar.";
  if (!jaSaudou) return `${per}, ${n}. Senha correta. Jade IA 3.6 online e inteiramente ao seu dispor.${extra}`;
  return rnd([`${per}, ${n}. Senha correta, como esperado.${extra}`, `Bem-vindo de volta, ${n}. Eu não estava esperando, é claro.${extra}`, `${per}, ${n}. Acesso liberado. Sempre às suas ordens.${extra}`]);
}
function tentarSenha() {
  const msg = $("lockMsg");
  if (Date.now() < bloqueadoAte) { msg.textContent = "Aguarde " + Math.ceil((bloqueadoAte - Date.now()) / 1000) + "s."; return; }
  if (hashS($("senha").value) === senhaAtual()) {
    tentativas = 0; $("senha").value = ""; msg.textContent = "";
    $("lock").classList.add("oculto"); $("app").classList.remove("oculto"); inputEl.focus();
    jadeDiz(saudacao()); jaSaudou = true;
  } else {
    tentativas++; $("senha").value = "";
    if (tentativas >= 3) { bloqueadoAte = Date.now() + 15000; tentativas = 0; msg.textContent = "Senha incorreta. Bloqueada por 15s."; }
    else msg.textContent = "Senha incorreta.";
  }
}
function trancar() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  fecharModo3D(); $("app").classList.add("oculto"); $("lock").classList.remove("oculto"); $("senha").focus();
}
function mudarSenha() {
  const at = prompt("Senha atual:"); if (at === null) return;
  if (hashS(at) !== senhaAtual()) return jadeDiz("Senha atual incorreta. Tentativa patética de me enganar.");
  const nv = prompt("Nova senha (mínimo 6 caracteres):"); if (!nv) return;
  if (nv.length < 6) return jadeDiz("Curta demais, Mestre. Escolha algo digno de mim.");
  try { localStorage.setItem("jade_pw", String(hashS(nv))); } catch (e) {}
  jadeDiz("Senha alterada.");
}
$("senha").addEventListener("keydown", e => { if (e.key === "Enter") tentarSenha(); });
renderChips();
