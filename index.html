<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jade IA 2.0 - 3D Studio Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
*{box-sizing:border-box}
body{background:#0d0814;font-family:'Segoe UI',Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px;color:#fff}
.app{width:100%;max-width:580px;background:#181124;padding:20px;border-radius:20px;border:1px solid #3b235d;box-shadow:0 10px 30px rgba(0,0,0,.8),0 0 15px rgba(138,43,226,.2);display:flex;flex-direction:column;gap:15px}
.header{text-align:center}
h1{color:#b366ff;margin:0;font-size:26px;text-shadow:0 0 8px rgba(179,102,255,.4)}
.subtitle{color:#a0a0b0;font-size:13px;margin-top:4px;font-weight:500}
#chat{background:#09050e;height:380px;overflow-y:auto;padding:15px;border-radius:14px;border:1px solid #2a1942;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.msg{max-width:90%;padding:10px 14px;border-radius:15px;font-size:14px;line-height:1.45;word-wrap:break-word}
.msg-jade{align-self:flex-start;background:#251638;color:#f0e6ff;border-bottom-left-radius:2px;border:1px solid #4c287a}
.msg-user{align-self:flex-end;background:#7928ca;color:#fff;border-bottom-right-radius:2px}
.msg-img-base{width:100%;max-width:280px;border-radius:10px;margin-top:8px;border:1px solid #7928ca;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#181124;border:1px solid #3b235d;color:#c9a8ff;padding:5px 10px;border-radius:14px;font-size:11px;cursor:pointer}
.chip:hover{background:#251638}
#container-3d{display:none;background:#05020a;border:1px solid #7928ca;border-radius:14px;padding:10px;flex-direction:column;gap:10px}
#canvas-3d{width:100%;height:260px;border-radius:10px;background:#000;touch-action:none;position:relative}
.controles-3d{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.controles-3d select,.controles-3d input,.controles-3d button{background:#181124;border:1px solid #3b235d;color:#fff;padding:6px;border-radius:8px;font-size:12px}
.checkbox-container{grid-column:span 2;display:flex;align-items:center;gap:8px;font-size:12px;color:#0fc}
.input-box{display:flex;gap:8px}
input[type="text"]{flex:1;min-width:0;padding:12px 15px;background:#09050e;border:1px solid #3b235d;border-radius:12px;outline:none;font-size:14px;color:#fff}
input[type="text"]:focus{border-color:#9d4edf;box-shadow:0 0 8px rgba(157,78,223,.4)}
button{padding:12px 15px;border:0;border-radius:12px;background:#7928ca;color:#fff;font-weight:bold;cursor:pointer;transition:background .2s,transform .1s}
button:hover{background:#9d4edf}
button:active{transform:scale(.95)}
.btn-mic{background:#4c287a;user-select:none}
.btn-mic.recording{background:#ff2a6d;animation:pulse 1s infinite}
.footer-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.shortcut-hint{font-size:11px;color:#6e6e8d}
.btn-clear{background:transparent;color:#a0a0b0;font-size:11px;padding:0;text-decoration:underline}
.btn-clear:hover{color:#ff4d4d;background:transparent}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Jade IA</h1>
    <div class="subtitle">Criada por Luiz Benicio</div>
  </div>

  <div id="container-3d">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;font-weight:bold;color:#b366ff;">Modo Visualizador 3D Avançado</span>
      <button style="padding:2px 8px;font-size:10px;" onclick="fecharModo3D()">Fechar 3D</button>
    </div>
    <div id="canvas-3d"></div>
    <div class="controles-3d">
      <select id="selectForma">
        <option value="camaro">Camaro / Esportivo</option>
        <option value="carro">Carro Convencional</option>
        <option value="robo">Robô Humanoide</option>
        <option value="casa">Casa Moderna</option>
        <option value="foguete">Foguete Espacial</option>
        <option value="torus">Torus (Anel)</option>
        <option value="cube">Cubo / Bloco</option>
        <option value="sphere">Esfera / Orbe</option>
      </select>
      <select id="selectMaterial">
        <option value="phong">Brilhante (Padrão)</option>
        <option value="standard">Metálico</option>
        <option value="glass">Vidro / Reflexivo</option>
      </select>
      <input type="color" id="corObjeto" value="#facc15">
      <button onclick="adicionarForma3DManual()">Adicionar Forma</button>
      <div class="checkbox-container">
        <input type="checkbox" id="chkMesclar">
        <label for="chkMesclar">Mesclar com o projeto atual</label>
      </div>
      <button onclick="limparCena3D()" style="background:#4c287a;">Limpar Cenas</button>
      <button onclick="salvarProjeto3D()" style="background:#00b386;">Salvar Projeto</button>
    </div>
  </div>

  <div id="chat"></div>
  <div class="chips" id="chips"></div>

  <div class="input-box">
    <input id="mensagem" type="text" placeholder="Converse ou peça: 'Crie um camaro amarelo 3D'..." autocomplete="off">
    <button onclick="enviar()">Enviar</button>
    <button id="btnOuvir" class="btn-mic" onmousedown="iniciarGravacao()" onmouseup="pararGravacao()" onmouseleave="pararGravacao()" ontouchstart="iniciarGravacao(event)" ontouchend="pararGravacao(event)">Falar</button>
  </div>

  <div class="footer-actions">
    <span class="shortcut-hint"><b>C</b> falar | <b>V</b> status | <b>T</b> 3D | <b>N</b> voltar</span>
    <span>
      <button class="btn-clear" id="btnVoz" onclick="alternarVoz()">Voz: ligada</button> &nbsp;
      <button class="btn-clear" onclick="limparMemoria()">Resetar aprendizado</button>
    </span>
  </div>
</div>

<script>
/* ================= ESTADO E MEMÓRIA ================= */
let memoria = { conhecimentos: [], tarefas: [], projetos3D: [], perfil: {} };
try { Object.assign(memoria, JSON.parse(localStorage.getItem("jade_memoria")) || {}); } catch (e) {}
memoria.perfil = memoria.perfil || {};

let gravacaoAtiva = false, rec = null, vozLigada = true;
let modo3DAtivo = false, scene3D, camera3D, renderer3D, grupoProjeto3D, controls3D, animId3D = null;
let ultimoToque3D = Date.now(), autoGirar3D = false;

const inputEl = document.getElementById("mensagem");
const chatEl = document.getElementById("chat");
const btnMic = document.getElementById("btnOuvir");

/* ================= UTILIDADES ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = arr => arr[Math.floor(Math.random() * arr.length)];
const salvarMemoria = () => { try { localStorage.setItem("jade_memoria", JSON.stringify(memoria)); } catch (e) {} };

function normalizar(txt) {
  return String(txt).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/(.)\1{2,}/g, "$1").replace(/[?!=.,;:]/g, " ").replace(/\s+/g, " ").trim();
}

/* ================= VOZ / CHAT ================= */
function alternarVoz() {
  vozLigada = !vozLigada;
  if (!vozLigada && 'speechSynthesis' in window) speechSynthesis.cancel();
  document.getElementById("btnVoz").textContent = "Voz: " + (vozLigada ? "ligada" : "desligada");
}

function falar(texto) {
  if (!vozLigada || !('speechSynthesis' in window)) return;
  let t = texto.replace(/<small>.*?<\/small>/g, ' ').replace(/<[^>]*>?/gm, ' ').replace(/&\w+;/g, ' ').replace(/\s+/g, ' ').trim();
  if (t.length > 220) t = t.substring(0, 220).replace(/\s\S*$/, "") + "...";
  speechSynthesis.cancel();
  const v = new SpeechSynthesisUtterance(t);
  v.lang = "pt-BR"; v.pitch = 1.1; v.rate = 1.0;
  speechSynthesis.speak(v);
}

function escrever(texto, remetente, imgUrl) {
  const div = document.createElement("div");
  div.classList.add("msg");
  if (remetente === "user") {
    div.classList.add("msg-user");
    div.innerHTML = `<b>Mestre:</b> ${esc(texto)}`;
  } else {
    div.classList.add("msg-jade");
    let conteudo = `<b>Jade:</b> ${texto}`;
    if (imgUrl) {
      conteudo += `<br><small style="color:#b366ff;margin-top:5px;display:block;">🖼️ <b>Imagem usada de base:</b></small>
                   <img src="${imgUrl}" class="msg-img-base" alt="Imagem base 3D" loading="lazy">`;
    }
    div.innerHTML = conteudo;
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function jadeDiz(html, voz, imgUrl) { escrever(html, "jade", imgUrl); falar(voz || html); }

function renderChips() {
  const sugestoes = ["Crie um camaro amarelo", "Crie um robô azul 3D", "Desenhe um foguete", "Modo 3D", "Limpar 3D"];
  const box = document.getElementById("chips");
  box.innerHTML = "";
  sugestoes.forEach(s => {
    const c = document.createElement("span");
    c.className = "chip"; c.textContent = s;
    c.onclick = () => { inputEl.value = s; enviar(); };
    box.appendChild(c);
  });
}

/* ================= ATALHOS DE TECLADO ================= */
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") enviar(); });
window.addEventListener("keydown", e => {
  if (document.activeElement === inputEl) return;
  const k = e.key.toLowerCase();
  if (k === "c" && !gravacaoAtiva) iniciarGravacao();
  else if (k === "t") { e.preventDefault(); ativarModo3D(); }
});

function limparMemoria() {
  if (confirm("Mestre, deseja apagar o aprendizado e projetos salvos?")) {
    memoria = { conhecimentos: [], tarefas: [], projetos3D: [], perfil: {} };
    salvarMemoria();
    jadeDiz("Minha memória foi totalmente restaurada, Mestre!");
  }
}

/* ================= MÓDULO 3D & AUTO-ROTAÇÃO ================= */
function registrarInteracao3D() {
  ultimoToque3D = Date.now();
  autoGirar3D = false;
}

function inicializarCena3D() {
  const c = document.getElementById("canvas-3d");
  c.innerHTML = "";
  if (animId3D) cancelAnimationFrame(animId3D);
  if (typeof THREE === "undefined") { c.innerHTML = "<p style='padding:10px;font-size:12px'>Three.js indisponível.</p>"; return; }

  scene3D = new THREE.Scene();
  camera3D = new THREE.PerspectiveCamera(60, c.clientWidth / c.clientHeight, 0.1, 1000);
  camera3D.position.set(0, 2, 5);

  renderer3D = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer3D.setSize(c.clientWidth, c.clientHeight);
  renderer3D.setPixelRatio(window.devicePixelRatio);
  c.appendChild(renderer3D.domElement);

  controls3D = new THREE.OrbitControls(camera3D, renderer3D.domElement);
  controls3D.enableDamping = true; controls3D.dampingFactor = 0.05;

  // Eventos de detecção de toque/interação (Inatividade de 10s)
  controls3D.addEventListener('start', registrarInteracao3D);
  renderer3D.domElement.addEventListener('pointerdown', registrarInteracao3D);
  renderer3D.domElement.addEventListener('touchstart', registrarInteracao3D);

  const luz = new THREE.DirectionalLight(0xffffff, 1.2); luz.position.set(5, 10, 7); scene3D.add(luz);
  scene3D.add(new THREE.AmbientLight(0xffffff, 0.8));

  grupoProjeto3D = new THREE.Group(); scene3D.add(grupoProjeto3D);

  // Loop de Renderização com lógica de Inatividade de 10 segundos
  (function loop() {
    animId3D = requestAnimationFrame(loop);
    
    // Verificação de 10 segundos sem toque para iniciar auto-rotação leve
    if (Date.now() - ultimoToque3D > 10000) {
      autoGirar3D = true;
    }

    if (autoGirar3D && grupoProjeto3D) {
      grupoProjeto3D.rotation.y += 0.005; // Gira suavemente no eixo Y
    }

    controls3D.update();
    renderer3D.render(scene3D, camera3D);
  })();
}

function ativarModo3D() {
  modo3DAtivo = true;
  document.getElementById("container-3d").style.display = "flex";
  inicializarCena3D();
  jadeDiz("Modo 3D ativado, Mestre! O modelo começará a girar se não for tocado por 10 segundos.", "Estúdio 3D ativado!");
}

fecharModo3D = function() {
  modo3DAtivo = false;
  document.getElementById("container-3d").style.display = "none";
  if (animId3D) cancelAnimationFrame(animId3D);
};

/* ================= GERADOR DE MATERIAIS & FORMAS ================= */
function criarMaterial3D(tipo, hex) {
  const color = new THREE.Color(hex), side = THREE.DoubleSide;
  if (tipo === 'standard') return new THREE.MeshStandardMaterial({ color, roughness: .3, metalness: .8, side });
  if (tipo === 'glass') return new THREE.MeshPhysicalMaterial({ color, roughness: .1, transmission: .9, opacity: 1, transparent: true, side });
  return new THREE.MeshPhongMaterial({ color, shininess: 80, side });
}

const mk = (geo, cor, mat) => new THREE.Mesh(geo, criarMaterial3D(mat, cor));

function criarGeometriaBase(t) {
  switch (t) {
    case 'torus': return new THREE.TorusGeometry(1.2, 0.4, 16, 100);
    case 'cube': return new THREE.BoxGeometry(1.5, 1.5, 1.5);
    case 'sphere': return new THREE.SphereGeometry(1.2, 32, 32);
    default: return new THREE.BoxGeometry(1.2, 1.2, 1.2);
  }
}

/* Receitas Avançadas dos Modelos Procedurais */
function construirModelosComplexos(chave, corPadrao, mat) {
  const g = new THREE.Group();
  const mainColor = corPadrao || "#facc15"; // Amarelo padrão caso seja Camaro

  if (chave === 'camaro') {
    // Corpo / Chassi Principal do Camaro
    const chassi = mk(new THREE.BoxGeometry(2.6, 0.55, 1.3), mainColor, mat); chassi.position.y = 0.25; g.add(chassi);
    // Teto esportivo/rebaixado
    const teto = mk(new THREE.BoxGeometry(1.3, 0.45, 1.1), "#111111", mat); teto.position.set(-0.1, 0.65, 0); g.add(teto);
    // Capô inclinado
    const capo = mk(new THREE.BoxGeometry(0.9, 0.15, 1.25), mainColor, mat); capo.position.set(0.8, 0.42, 0); capo.rotation.z = -0.08; g.add(capo);
    // Listras esportivas do Camaro (Preto)
    const listra1 = mk(new THREE.BoxGeometry(2.5, 0.02, 0.22), "#111", 'phong'); listra1.position.set(0, 0.54, 0.25); g.add(listra1);
    const listra2 = mk(new THREE.BoxGeometry(2.5, 0.02, 0.22), "#111", 'phong'); listra2.position.set(0, 0.54, -0.25); g.add(listra2);
    // Rodas (4 Rodas esportivas)
    const posRodas = [[0.8, 0.65], [0.8, -0.65], [-0.8, 0.65], [-0.8, -0.65]];
    posRodas.forEach(([x, z]) => {
      const roda = mk(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 24), "#222", 'standard');
      roda.rotation.x = Math.PI / 2; roda.position.set(x, 0, z); g.add(roda);
      const aro = mk(new THREE.CylinderGeometry(0.18, 0.18, 0.22, 16), "#ccc", 'standard');
      aro.rotation.x = Math.PI / 2; aro.position.set(x, 0, z); g.add(aro);
    });
    // Faróis dianteiros
    const f1 = mk(new THREE.BoxGeometry(0.05, 0.12, 0.25), "#00e5ff", 'phong'); f1.position.set(1.31, 0.32, 0.4); g.add(f1);
    const f2 = mk(new THREE.BoxGeometry(0.05, 0.12, 0.25), "#00e5ff", 'phong'); f2.position.set(1.31, 0.32, -0.4); g.add(f2);
  } else if (chave === 'carro') {
    const chassi = mk(new THREE.BoxGeometry(2.2, 0.5, 1.1), mainColor, mat); g.add(chassi);
    const cabine = mk(new THREE.BoxGeometry(1.1, 0.45, 0.95), "#bfe6ff", 'glass'); cabine.position.set(-0.1, 0.45, 0); g.add(cabine);
    [[-0.6, 0.55], [-0.6, -0.55], [0.6, 0.55], [0.6, -0.55]].forEach(([x, z]) => {
      const r = mk(new THREE.CylinderGeometry(0.28, 0.28, 0.18, 20), "#111", 'standard');
      r.rotation.x = Math.PI / 2; r.position.set(x, -0.2, z); g.add(r);
    });
  } else if (chave === 'robo') {
    const tronco = mk(new THREE.BoxGeometry(1, 1.2, 0.7), mainColor, mat); g.add(tronco);
    const cabeca = mk(new THREE.BoxGeometry(0.6, 0.55, 0.5), "#cccccc", 'standard'); cabeca.position.y = 0.95; g.add(cabeca);
    const olhar = mk(new THREE.BoxGeometry(0.4, 0.12, 0.1), "#00e5ff", 'phong'); olhar.position.set(0, 1.0, 0.26); g.add(olhar);
    const bracoE = mk(new THREE.BoxGeometry(0.25, 0.9, 0.25), mainColor, mat); bracoE.position.set(-0.68, 0.1, 0); g.add(bracoE);
    const bracoD = mk(new THREE.BoxGeometry(0.25, 0.9, 0.25), mainColor, mat); bracoD.position.set(0.68, 0.1, 0); g.add(bracoD);
  } else if (chave === 'casa') {
    const base = mk(new THREE.BoxGeometry(2, 1.4, 2), mainColor, mat); g.add(base);
    const telhado = mk(new THREE.ConeGeometry(1.6, 1, 4), "#a0392b", mat); telhado.position.y = 1.2; telhado.rotation.y = Math.PI / 4; g.add(telhado);
  } else if (chave === 'foguete') {
    const corpo = mk(new THREE.CylinderGeometry(0.5, 0.5, 2.2, 24), mainColor, mat); g.add(corpo);
    const topo = mk(new THREE.ConeGeometry(0.5, 0.8, 24), "#d62828", mat); topo.position.y = 1.5; g.add(topo);
  } else {
    g.add(mk(criarGeometriaBase(chave), mainColor, mat));
  }
  return g;
}

function descartar(o) {
  o.traverse(n => {
    if (n.geometry) n.geometry.dispose();
    if (n.material) n.material.dispose();
  });
  if (o.parent) o.parent.remove(o);
}

function limparCena3D() { if (grupoProjeto3D) while (grupoProjeto3D.children.length) descartar(grupoProjeto3D.children[0]); }

function inserirEEnquadrar(obj) {
  limparCena3D();
  grupoProjeto3D.add(obj);
  grupoProjeto3D.rotation.set(0, 0, 0);
  registrarInteracao3D(); // Reset do tempo de inatividade
}

function adicionarObjeto3D(chave, mat, cor) {
  if (!modo3DAtivo) ativarModo3D();
  const o = construirModelosComplexos(chave, cor, mat);
  inserirEEnquadrar(o);
}

function adicionarForma3DManual() {
  adicionarObjeto3D(document.getElementById("selectForma").value, document.getElementById("selectMaterial").value, document.getElementById("corObjeto").value);
}

function salvarProjeto3D() {
  if (!grupoProjeto3D || !grupoProjeto3D.children.length) { alert("Sem objetos para salvar!"); return; }
  const nome = prompt("Nome do projeto 3D:", "Projeto Jade " + (memoria.projetos3D.length + 1));
  if (nome) {
    memoria.projetos3D.push({ nome, data: new Date().toLocaleDateString('pt-BR') });
    salvarMemoria();
    jadeDiz(`Projeto <b>"${esc(nome)}"</b> salvo na memória!`);
  }
}

/* ================= RECONHECIMENTO E PROCESSAMENTO ================= */
function interpretarSolicitacao3D(texto) {
  const t = normalizar(texto);
  
  // Detecção de cores
  let cor = "#facc15"; // Amarelo padrão
  if (t.includes("vermelh")) cor = "#e02424";
  else if (t.includes("azul")) cor = "#2563eb";
  else if (t.includes("verd")) cor = "#16a34a";
  else if (t.includes("pret")) cor = "#222222";
  else if (t.includes("branc")) cor = "#ffffff";
  else if (t.includes("roxo")) cor = "#8b3dff";
  else if (t.includes("rosa")) cor = "#ec4899";

  // Detecção do Modelo
  let modelo = "cube";
  let nomeExibicao = "Modelo 3D";

  if (t.includes("camaro")) { modelo = "camaro"; nomeExibicao = "Camaro Esportivo"; }
  else if (t.includes("carro") || t.includes("automovel")) { modelo = "carro"; nomeExibicao = "Carro"; }
  else if (t.includes("robo") || t.includes("android")) { modelo = "robo"; nomeExibicao = "Robô"; }
  else if (t.includes("casa")) { modelo = "casa"; nomeExibicao = "Casa"; }
  else if (t.includes("foguete")) { modelo = "foguete"; nomeExibicao = "Foguete"; }
  else if (t.includes("esfera") || t.includes("bola")) { modelo = "sphere"; nomeExibicao = "Esfera"; }

  // Geração de imagem base via IA (Pollinations API)
  const promptImg = encodeURIComponent(`${nomeExibicao} ${t.includes("amarelo") ? "yellow" : ""} 3D render concept art high quality`);
  const imgUrl = `https://image.pollinations.ai/prompt/${promptImg}?width=500&height=300&nologo=true`;

  adicionarObjeto3D(modelo, 'phong', cor);

  jadeDiz(`Criei o modelo 3D do <b>${nomeExibicao}</b> conforme solicitado, Mestre! Se não interagir por 10 segundos, ele começará a girar levemente.`, 
          `Criei o modelo 3D do ${nomeExibicao} para você!`, imgUrl);
}

function processarComando(txt) {
  const norm = normalizar(txt);
  if (!norm) return;

  escrever(txt, "user");
  inputEl.value = "";

  if (norm.includes("3d") || norm.includes("crie") || norm.includes("desenhe") || norm.includes("modelo")) {
    interpretarSolicitacao3D(txt);
  } else if (norm.includes("que horas")) {
    jadeDiz(`Mestre, agora são <b>${new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</b>.`);
  } else if (norm.includes("limpar 3d")) {
    limparCena3D();
    jadeDiz("Cena 3D limpa com sucesso!");
  } else {
    jadeDiz(`Compreendido, Mestre! Processando sua solicitação sobre: "<i>${esc(txt)}</i>".`);
  }
}

function enviar() { processarComando(inputEl.value); }

/* ================= ÁUDIO / MIC ================= */
function iniciarGravacao() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert("Reconhecimento de voz não suportado neste navegador."); return;
  }
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  rec = new SpeechRec(); rec.lang = "pt-BR"; rec.continuous = false;
  rec.onstart = () => { gravacaoAtiva = true; btnMic.classList.add("recording"); };
  rec.onresult = e => { processarComando(e.results[0][0].transcript); };
  rec.onerror = () => pararGravacao();
  rec.onend = () => pararGravacao();
  rec.start();
}

function pararGravacao() {
  gravacaoAtiva = false; btnMic.classList.remove("recording");
  if (rec) { try { rec.stop(); } catch(e){} rec = null; }
}

/* Inicialização */
renderChips();
</script>
